<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TA Process Mapper — TASSP Playbook</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ac: #8B1A1A;
    --ac-bg: rgba(139,26,26,0.07);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --bg: #ffffff;
    --bg2: #f8f7f4;
    --bg3: #f1efe8;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.2);
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #242422; --bg3: #2c2c2a;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --text: #e8e6de; --text2: #a8a69e; --text3: #6e6c66;
    }
  }
  body { font-family: var(--font); background: var(--bg3); color: var(--text); font-size: 15px; line-height: 1.5; }

  /* ── LAYOUT ── */
  #shell { max-width: 860px; margin: 0 auto; min-height: 100vh; }
  .header { background: var(--ac); color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .hdr-left { display: flex; align-items: center; gap: 14px; }
  .hdr-logo { width: 36px; height: 36px; background: rgba(255,255,255,.18); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
  .hdr-title { font-size: 15px; font-weight: 500; }
  .hdr-sub { font-size: 12px; opacity: .65; margin-top: 1px; }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  .save-indicator { font-size: 11px; opacity: .8; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 20px; }
  .save-dot { width: 7px; height: 7px; border-radius: 50%; background: #7fff7f; flex-shrink: 0; }
  .save-dot.saving { background: #ffdd44; animation: pulse .8s ease-in-out infinite; }
  .save-dot.error { background: #ff6b6b; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

  /* ── PROGRESS ── */
  .pbar-wrap { height: 3px; background: rgba(0,0,0,.08); }
  .pbar-fill { height: 100%; background: var(--ac); transition: width .4s ease; }

  /* ── NAV ── */
  .snav { background: var(--bg2); border-bottom: 0.5px solid var(--border); padding: 0 28px; display: flex; overflow-x: auto; gap: 0; }
  .snav::-webkit-scrollbar { display: none; }
  .nitem { padding: 11px 12px 9px; font-size: 11px; color: var(--text3); border-bottom: 2px solid transparent; cursor: default; white-space: nowrap; display: flex; align-items: center; gap: 5px; transition: all .15s; }
  .nitem.done { color: #3B6D11; cursor: pointer; }
  .nitem.active { color: var(--ac); border-bottom-color: var(--ac); font-weight: 500; }
  .ndot { width: 16px; height: 16px; border-radius: 50%; background: var(--bg3); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; }
  .nitem.done .ndot { background: #EAF3DE; border-color: #3B6D11; color: #27500A; }
  .nitem.active .ndot { background: var(--ac); border-color: var(--ac); color: #fff; }

  /* ── MAIN ── */
  .main { padding: 28px; }
  .qcard { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 26px; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .qlabel { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ac); margin-bottom: 10px; }
  .qtext { font-size: 17px; font-weight: 500; margin-bottom: 6px; color: var(--text); line-height: 1.4; }
  .qhint { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.55; }

  /* ── OPTIONS ── */
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 15px; border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all .12s; background: var(--bg); user-select: none; }
  .opt:hover, .opt.sel { border-color: var(--ac); background: var(--ac-bg); }
  .chk { width: 18px; height: 18px; min-width: 18px; border: 0.5px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-top: 1px; background: var(--bg); transition: all .12s; }
  .opt.sel .chk { background: var(--ac); border-color: var(--ac); }
  .chkm { display: none; font-size: 11px; color: #fff; font-weight: 600; }
  .opt.sel .chkm { display: block; }
  .rad { width: 18px; height: 18px; min-width: 18px; border: 0.5px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 1px; background: var(--bg); }
  .opt.sel .rad { border-color: var(--ac); }
  .radd { width: 8px; height: 8px; border-radius: 50%; display: none; background: var(--ac); }
  .opt.sel .radd { display: block; }
  .ol { font-size: 14px; color: var(--text); line-height: 1.4; }
  .od { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* ── INPUTS ── */
  .mini { width: 100%; font-size: 13px; padding: 9px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: var(--font); }
  .mini:focus { outline: none; border-color: var(--ac); }
  .addc { display: flex; gap: 8px; margin-top: 8px; }
  .addc input { flex: 1; font-size: 13px; padding: 10px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); }
  .addc input:focus { outline: none; border-color: var(--ac); }
  .addc button, .btn-ac { padding: 10px 18px; color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-family: var(--font); background: var(--ac); transition: opacity .12s; }
  .addc button:hover, .btn-ac:hover { opacity: .88; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text); }
  .tx { cursor: pointer; color: var(--text3); font-size: 14px; }
  .tx:hover { color: var(--ac); }

  /* ── FOOTER NAV ── */
  .fnav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .bbtn { padding: 10px 20px; background: transparent; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 14px; cursor: pointer; color: var(--text2); font-family: var(--font); transition: all .12s; }
  .bbtn:hover { border-color: var(--border2); color: var(--text); }
  .nbtn { padding: 10px 24px; color: #fff; border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; font-weight: 500; font-family: var(--font); display: flex; align-items: center; gap: 8px; background: var(--ac); transition: opacity .12s; }
  .nbtn:hover { opacity: .88; }
  .nbtn:disabled { opacity: .4; cursor: default; }
  .qctr { font-size: 12px; color: var(--text3); }

  /* ── EMAIL SAVE PANEL ── */
  .save-panel { margin-top: 18px; padding: 16px 18px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); }
  .save-panel-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text); display: flex; align-items: center; gap: 7px; }
  .save-panel-hint { font-size: 12px; color: var(--text2); margin-bottom: 12px; line-height: 1.5; }
  .save-email-row { display: flex; gap: 8px; }
  .save-email-row input { flex: 1; font-size: 13px; padding: 9px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: var(--font); }
  .save-email-row input:focus { outline: none; border-color: var(--ac); }
  .save-success { font-size: 12px; color: #3B6D11; margin-top: 8px; display: none; }

  /* ── RESUME SCREEN ── */
  .resume-screen { padding: 40px 28px; text-align: center; }
  .resume-card { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 32px; max-width: 520px; margin: 0 auto; }
  .resume-icon { width: 56px; height: 56px; background: var(--ac-bg); border: 0.5px solid; border-color: var(--ac); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .resume-title { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .resume-meta { font-size: 13px; color: var(--text2); margin-bottom: 22px; line-height: 1.6; }
  .resume-detail { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .resume-detail:last-child { border-bottom: none; }
  .resume-detail span:first-child { color: var(--text2); }
  .resume-detail span:last-child { font-weight: 500; }
  .resume-details-block { background: var(--bg2); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 22px; }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a18; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; transition: transform .3s ease; z-index: 999; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── COPY LINK ── */
  .link-box { display: flex; gap: 8px; margin-top: 12px; }
  .link-input { flex: 1; font-size: 12px; padding: 8px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg2); color: var(--text2); font-family: monospace; }
  .copy-btn { padding: 8px 14px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 12px; cursor: pointer; color: var(--text2); font-family: var(--font); transition: all .12s; white-space: nowrap; }
  .copy-btn:hover { border-color: var(--ac); color: var(--ac); }

  /* ── CALLOUT ── */
  .callout { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; border-left: 3px solid; }
  .callout.info { background: #f0f7ff; border-color: #185FA5; }
  .callout.info p { font-size: 13px; color: #0C447C; line-height: 1.5; }
  @media (prefers-color-scheme: dark) {
    .callout.info { background: #0d1f35; }
    .callout.info p { color: #85B7EB; }
  }
</style>
</head>

  .snav-brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-size:15px;color:#f0ede8;font-weight:500;}

<script>
// ─────────────────────────────────────────────────────────────────────────────
// SUPABASE CLIENT
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://fpenseudntsilynmhwje.supabase.co';
const SUPABASE_ANON = 'sb_publishable_rgWAZAaMLHFP548XcR1oVg_kEx-nKKr';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ─────────────────────────────────────────────────────────────────────────────
// SESSION STATE
// ─────────────────────────────────────────────────────────────────────────────
let SESSION_ID = null;
let RESUME_TOKEN = null;
let SAVE_TIMEOUT = null;
let SAVE_STATUS = 'idle'; // idle | saving | saved | error
let HAS_INTERACTION = false;  // autosave only starts after first answer
let LAST_SAVED_AT = null;     // timestamp of last successful save
let AUTOSAVE_INTERVAL = null; // 30-second interval handle
let TIMESTAMP_INTERVAL = null; // updates the "last saved X ago" display

// Generate or load resume token from URL
function getOrCreateToken() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('token')) return params.get('token');
  // Generate a UUID v4
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// Push resume token to URL without reload
function setTokenInURL(token) {
  const url = new URL(window.location.href);
  url.searchParams.set('token', token);
  window.history.replaceState({}, '', url.toString());
}

// Set auth header for RLS
function getHeaders() {
  return { 'x-resume-token': RESUME_TOKEN };
}

// ─────────────────────────────────────────────────────────────────────────────
// SAVE / LOAD
// ─────────────────────────────────────────────────────────────────────────────
async function initSession() {
  RESUME_TOKEN = getOrCreateToken();
  setTokenInURL(RESUME_TOKEN);

  // Try to load existing session
  const { data: existing } = await sb
    .from('sessions')
    .select('id, track_name, mode, accent_color, current_section, status')
    .eq('resume_token', RESUME_TOKEN)
    .single();

  if (existing) {
    SESSION_ID = existing.id;
    // Load all section data
    const { data: sections } = await sb
      .from('session_data')
      .select('section, data')
      .eq('session_id', SESSION_ID);

    if (sections) {
      sections.forEach(s => {
        if (D[s.section]) Object.assign(D[s.section], s.data);
      });
    }
    // Restore position
    if (existing.current_section) {
      const idx = activeSecs.indexOf(existing.current_section);
      if (idx > -1) cs = idx;
    }
    if (existing.accent_color) applyAC(existing.accent_color);
    showResumeScreen(existing);
    return;
  }

  // Create new session
  const { data: newSession, error } = await sb
    .from('sessions')
    .insert({
      resume_token: RESUME_TOKEN,
      track_name: D.setup.trackName || '',
      mode: mode,
      accent_color: AC,
      current_section: 'setup',
      status: 'in_progress'
    })
    .select('id')
    .single();

  if (newSession) {
    SESSION_ID = newSession.id;
    setSaveStatus('saved');
  } else {
    console.warn('Session create failed:', error);
    setSaveStatus('error');
  }
}

async function saveSection(section) {
  if (!SESSION_ID || !RESUME_TOKEN) return;
  setSaveStatus('saving');
  clearTimeout(SAVE_TIMEOUT);
  SAVE_TIMEOUT = setTimeout(async () => {
    try {
      // Upsert section data
      const { error: dataErr } = await sb
        .from('session_data')
        .upsert({
          session_id: SESSION_ID,
          section: section,
          data: D[section] || {},
          saved_at: new Date().toISOString()
        }, { onConflict: 'session_id,section' });

      // Update session metadata
      const updates = {
        current_section: activeSecs[cs] || section,
        updated_at: new Date().toISOString(),
      };
      if (D.setup.trackName) updates.track_name = D.setup.trackName;
      if (D.setup.mode) updates.mode = D.setup.mode;
      if (AC) updates.accent_color = AC;

      const { error: sessErr } = await sb
        .from('sessions')
        .update(updates)
        .eq('resume_token', RESUME_TOKEN);

      setSaveStatus(dataErr || sessErr ? 'error' : 'saved');
    } catch(e) {
      setSaveStatus('error');
    }
  }, 600);
}

async function saveEmail(email) {
  if (!SESSION_ID || !email) return;
  const { error } = await sb
    .from('sessions')
    .update({ email })
    .eq('resume_token', RESUME_TOKEN);
  if (!error) {
    await sendResumeEmail(email);
    return true;
  }
  return false;
}

async function sendResumeEmail(email) {
  // Supabase Edge Function or direct magic link
  // For now, use Supabase Auth OTP as the email mechanism
  const resumeURL = `https://tacticHub.github.io/TASSP-Playbook/process-mapper-tool.html?token=${RESUME_TOKEN}`;
  // We store the URL — in production you'd trigger a Supabase Edge Function
  // to send a custom email. For now show the link to copy.
  return resumeURL;
}

function setSaveStatus(status) {
  SAVE_STATUS = status;
  if (status === 'saved') LAST_SAVED_AT = new Date();
  const ind = document.getElementById('save-indicator');
  const dot = document.getElementById('save-dot');
  const lbl = document.getElementById('save-label');
  if (!ind) return;
  ind.style.display = 'flex';
  dot.className = 'save-dot' + (status === 'saving' ? ' saving' : status === 'error' ? ' error' : '');
  updateSaveLabel();
}

function updateSaveLabel() {
  const lbl = document.getElementById('save-label');
  if (!lbl) return;
  if (SAVE_STATUS === 'saving') { lbl.textContent = 'Saving…'; return; }
  if (SAVE_STATUS === 'error')  { lbl.textContent = 'Save error'; return; }
  if (!LAST_SAVED_AT)           { lbl.textContent = 'Not saved yet'; return; }
  const secs = Math.floor((new Date() - LAST_SAVED_AT) / 1000);
  if (secs < 5)   lbl.textContent = 'Saved just now';
  else if (secs < 60)  lbl.textContent = `Saved ${secs}s ago`;
  else if (secs < 3600) lbl.textContent = `Saved ${Math.floor(secs/60)}m ago`;
  else lbl.textContent = 'Saved';
}

function startTimestampInterval() {
  if (TIMESTAMP_INTERVAL) return;
  TIMESTAMP_INTERVAL = setInterval(updateSaveLabel, 5000);
}

function markInteraction() {
  if (HAS_INTERACTION) return;
  HAS_INTERACTION = true;
  startAutosave();
  startTimestampInterval();
}

function startAutosave() {
  if (AUTOSAVE_INTERVAL) return;
  AUTOSAVE_INTERVAL = setInterval(async () => {
    if (!SESSION_ID || !RESUME_TOKEN || !HAS_INTERACTION) return;
    const currentSec = activeSecs[cs];
    if (currentSec && currentSec !== 'review' && D[currentSec]) {
      await saveSection(currentSec);
    }
  }, 30000); // every 30 seconds
}

function stopAutosave() {
  if (AUTOSAVE_INTERVAL) { clearInterval(AUTOSAVE_INTERVAL); AUTOSAVE_INTERVAL = null; }
  if (TIMESTAMP_INTERVAL) { clearInterval(TIMESTAMP_INTERVAL); TIMESTAMP_INTERVAL = null; }
}

function showToast(msg, dur = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function showResumeScreen(session) {
  const main = document.getElementById('main');
  const trackLabel = session.track_name || 'Unnamed track';
  const resumeURL = `https://tacticHub.github.io/TASSP-Playbook/process-mapper-tool.html?token=${RESUME_TOKEN}`;

  main.innerHTML = `
    <div class="resume-screen">
      <div class="resume-card">
        <div class="resume-icon">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <path d="M13 3C7.477 3 3 7.477 3 13s4.477 10 10 10 10-4.477 10-10S18.523 3 13 3z" stroke="${AC}" stroke-width="1.5" fill="none"/>
            <path d="M13 7v6l4 2" stroke="${AC}" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="resume-title">Welcome back</div>
        <div class="resume-meta">We found a saved session for this link. Pick up right where you left off.</div>
        <div class="resume-details-block">
          <div class="resume-detail"><span>Process track</span><span>${trackLabel}</span></div>
          <div class="resume-detail"><span>Mode</span><span>${session.mode === 'quick' ? 'Quick (~15 min)' : 'Full (~45 min)'}</span></div>
          <div class="resume-detail"><span>Status</span><span style="text-transform:capitalize;">${session.status.replace('_',' ')}</span></div>
        </div>
        <div style="margin-bottom:14px;">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">Your resume link — bookmark this to return anytime:</div>
          <div class="link-box">
            <input class="link-input" type="text" readonly value="${resumeURL}" id="resume-url-input">
            <button class="copy-btn" onclick="copyResumeLink('${resumeURL}')">Copy link</button>
          </div>
        </div>
        <button class="nbtn" style="width:100%;justify-content:center;background:${AC};" onclick="continueSession()">
          Continue where I left off →
        </button>

function rSubprocess(){
  const stages=getStageList();
  stages.forEach(s=>{if(!D.subprocess[s.id])D.subprocess[s.id]={label:s.label,hasSubprocess:null,rounds:[],open:false};});
  const roles=getAllRoles();
  const cards=stages.map(s=>{
    const sp=D.subprocess[s.id];
    return`<div style="border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;">
      <div style="padding:12px 16px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="toggleSP('${s.id}')">
        <div style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;">
          <span style="width:7px;height:7px;border-radius:50%;background:${sp.hasSubprocess!==null?'#3B6D11':'var(--border2)'};"></span>
          ${s.label}
          ${sp.hasSubprocess===true?`<span style="padding:2px 8px;border-radius:20px;font-size:11px;background:${AC}12;border:.5px solid ${AC}40;color:${AC}">${sp.rounds.length} round${sp.rounds.length!==1?'s':''}</span>`:''}
        </div>
        <span style="font-size:11px;color:var(--text3);">${sp.open?'▲':'▼'}</span>

      ${sp.open?`<div style="padding:16px;border-top:.5px solid var(--border);">

        <div class="opts" style="margin-bottom:12px;">
          <div class="opt ${sp.hasSubprocess===true?'sel':''}" onclick="setSPHas('${s.id}',true)"><span class="rad"><span class="radd"></span></span><div><div class="ol">Yes — expand into sub-steps / rounds</div><div class="od">Multiple interview rounds, multi-step offer, phased onboarding, etc.</div></div></div>
          <div class="opt ${sp.hasSubprocess===false?'sel':''}" onclick="setSPHas('${s.id}',false)"><span class="rad"><span class="radd"></span></span><div class="ol">No — single step</div></div>
        </div>
        ${sp.hasSubprocess===true?buildRounds(s.id, roles):''}

    </div>`;
  }).join('');
  qc(`${sl('Sub-processes')}${qt('Do any stages have multiple steps or rounds?')}${qh('Expand any stage to define its internal sequence. Each sub-step gets its own node on the map with pass/fail gates between rounds.')}
  ${cards}${emailSavePanel()}${fnav('ns','Continue',false)}`);

function buildRounds(sid, roles){
  const sp=D.subprocess[sid];
  return sp.rounds.map((r,ri)=>`

    <div style="border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;">
      <div style="padding:10px 14px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="toggleRound('${sid}',${ri})">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:20px;height:20px;border-radius:50%;background:${AC};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;">${ri+1}</span>
          <input type="text" value="${r.name}" onclick="event.stopPropagation()" oninput="D.subprocess['${sid}'].rounds[${ri}].name=this.value" style="font-size:13px;font-weight:500;border:none;background:transparent;color:var(--text);padding:0;width:150px;font-family:var(--font);">

          <span style="font-size:12px;color:var(--text3);">${r.open?'▲':'▼'}</span>
        </div>
      </div>
      ${r.open?`<div style="padding:14px;border-top:.5px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;">Interview type</div><div style="display:flex;flex-wrap:wrap;gap:6px;">${ITYPES.map(t=>`<span style="padding:5px 11px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;${r.types?.includes(t.id)?`background:${AC}12;border-color:${AC};color:${AC}`:'background:var(--bg);border-color:var(--border);color:var(--text);'}" onclick="toggleRT('${sid}',${ri},'types','${t.id}')">${t.label}</span>`).join('')}</div></div>
        <div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;">Format</div><div style="display:flex;flex-wrap:wrap;gap:6px;">${FORMATS.map(f=>`<span style="padding:5px 11px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;${r.formats?.includes(f.id)?`background:${AC}12;border-color:${AC};color:${AC}`:'background:var(--bg);border-color:var(--border);color:var(--text);'}" onclick="toggleRT('${sid}',${ri},'formats','${f.id}')">${f.label}</span>`).join('')}</div></div>
        <div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;">Who conducts this round?</div><div style="display:flex;flex-wrap:wrap;gap:6px;">${roles.map(role=>`<span style="padding:5px 11px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;${r.conductors?.includes(role)?`background:${AC}12;border-color:${AC};color:${AC}`:'background:var(--bg);border-color:var(--border);color:var(--text);'}" onclick="toggleRR('${sid}',${ri},'conductors','${role.replace(/'/g,"\\'")}')">${role}</span>`).join('')}</div></div>
        <div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;">Scheduling method</div><div style="display:flex;flex-wrap:wrap;gap:6px;">${SCHED.map(m=>`<span style="padding:5px 11px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;${r.schedMethod?.includes(m.id)?`background:${AC}12;border-color:${AC};color:${AC}`:'background:var(--bg);border-color:var(--border);color:var(--text);'}" onclick="toggleRT('${sid}',${ri},'schedMethod','${m.id}')">${m.label}</span>`).join('')}</div></div>
        <div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;">Conditional trigger (optional)</div><div style="padding:8px 10px;background:#FAEEDA;border:.5px solid #BA7517;border-radius:var(--radius);display:flex;align-items:center;gap:8px;"><span style="font-size:11px;color:#854F0B;white-space:nowrap;font-weight:500;">Only if:</span><input type="text" placeholder="e.g. director-level roles, union position…" value="${r.condition||''}" oninput="D.subprocess['${sid}'].rounds[${ri}].condition=this.value" style="flex:1;font-size:12px;padding:0;border:none;background:transparent;color:#412402;font-family:var(--font);"></div></div>
      </div>`:''}
    </div>`).join('') +
  `<button onclick="addRound('${sid}')" style="width:100%;padding:10px;background:transparent;border:.5px dashed var(--border);border-radius:var(--radius);font-size:13px;cursor:pointer;color:var(--text2);font-family:var(--font);">+ Add another round</button>`;
}

window.setSPHas=function(sid,v){markInteraction();D.subprocess[sid].hasSubprocess=v;if(v&&D.subprocess[sid].rounds.length===0)D.subprocess[sid].rounds.push(mkRound(1));D.subprocess[sid].open=true;rSubprocess();};

        <div style="background:var(--bg2);border-radius:var(--radius);padding:12px;"><div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Decision owner</div><div style="display:flex;flex-wrap:wrap;gap:6px;">${roles.map(r=>`<span style="padding:5px 11px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;${a.decisionOwners.includes(r)?`background:${AC}12;border-color:${AC};color:${AC}`:'background:var(--bg);border-color:var(--border);color:var(--text);'}" onclick="togAR('${s.id}','decisionOwners','${r.replace(/'/g,"\\'")}')">${r}</span>`).join('')}</div></div>
        <div style="background:var(--bg2);border-radius:var(--radius);padding:12px;"><div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Outcomes</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${[{k:'advance',label:'Advance'},{k:'approve',label:'Approve'},{k:'reject',label:'Reject'},{k:'hold',label:'Hold'}].map(o=>`<span style="padding:5px 12px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;${a.outcomes.includes(o.k)?`background:${AC};color:#fff;border-color:${AC}`:'background:var(--bg);border-color:var(--border);color:var(--text);'}" onclick="togOut('${s.id}','${o.k}')">${o.label}</span>`).join('')}</div></div>
      </div>`:''}
    </div>`;
  }).join('');
  qc(`${sl('Actions')}${qt('Who owns each action at every stage?')}${qh('Assign decision owners and outcomes per stage. These appear as action nodes in your swimlane map.')}${cards}${emailSavePanel()}${fnav('ns','Continue',false)}`);
}

        <button class="copy-btn" onclick="navigator.clipboard.writeText('${resumeURL}').then(()=>showToast('Link copied!'))">Copy</button>
      </div>
    </div>

    <div style="margin-top:20px;">

      <div style="text-align:center;margin-top:10px;font-size:12px;color:var(--text3);">Generates 36×24" print-ready PDF map at 300 DPI + complete SOP Word document</div>

window.generateOutput = async function() {
  // Save session
  if(SESSION_ID && RESUME_TOKEN) {
    await sb.from('sessions').update({ status: 'completed' }).eq('resume_token', RESUME_TOKEN);
  }
  for(const sec of activeSecs) { if(D[sec]) await saveSection(sec); }
  HAS_INTERACTION = false; // prevent beforeunload after successful generate

  // Show generating state
  const btn = document.querySelector('button[onclick="generateOutput()"]');
  if(btn) { btn.textContent = 'Generating your outputs…'; btn.disabled = true; }
  showToast('Building your process map and SOP…', 4000);

  try {
    await Promise.all([generatePDF(), generateDOCX()]);
    if(btn) { btn.textContent = 'Generated — check your downloads ✓'; btn.style.background = '#27ae60'; }
    showToast('Both files downloaded successfully', 3500);
  } catch(e) {
    console.error('Generation error:', e);
    if(btn) { btn.textContent = 'Generate BPMN map & SOP →'; btn.disabled = false; }
    showToast('Error generating files — see console for details', 4000);
  }
};

async function generatePDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [2592, 1728] });

  const W = 2592, H = 1728, MARGIN = 32;
  const LABEL_W = 116, TITLE_H = 78, LEGEND_H = 36, FOOTER_H = 22, PHASE_H = 26;
  const MAP_X = MARGIN + LABEL_W;
  const MAP_Y = MARGIN + TITLE_H + 8;
  const MAP_TOP = H - MARGIN - LEGEND_H - FOOTER_H - PHASE_H - 10;
  const MAP_H = MAP_TOP - PHASE_H - MAP_Y;
  const MAP_W = W - MARGIN - MAP_X;

  const userLabels = [...D.users.selected.map(u => USERS.find(o=>o.id===u)?.label||u), ...D.users.custom];
  const stageList = getStageList();
  const integLabels = [...D.integrations.selected.map(i => INTEGS.find(o=>o.id===i)?.label||i), ...D.integrations.custom];
  const LANE_COUNT = Math.max(userLabels.length, 1);
  const LANE_H = MAP_H / LANE_COUNT;

  const [AR, AG, AB] = hexToRgbArr(AC);
  // Darkened brand color for text on light backgrounds
  const DR = Math.round(AR * 0.52), DG = Math.round(AG * 0.52), DB = Math.round(AB * 0.52);
  // Light brand tint for label column
  const LR = Math.min(255, 232 + Math.round((255-AR)*0.28));
  const LG = Math.min(255, 232 + Math.round((255-AG)*0.28));
  const LB = Math.min(255, 232 + Math.round((255-AB)*0.28));

  const PHASES = [
    { label: 'Req opening',        f0: 0.000, f1: 0.135 },
    { label: 'Req approval',       f0: 0.135, f1: 0.265 },
    { label: 'Sourcing & posting', f0: 0.265, f1: 0.375 },
    { label: 'Screening',          f0: 0.375, f1: 0.495 },
    { label: 'Interview',          f0: 0.495, f1: 0.735 },
    { label: 'Offer',              f0: 0.735, f1: 0.865 },
    { label: 'Pre-hire & handoff', f0: 0.865, f1: 1.000 },
  ];

  function px(f) { return MAP_X + f * MAP_W; }
  function laneCY(i) { return MAP_Y + MAP_H - (i + 0.5) * LANE_H; }
  function laneBot(i) { return MAP_Y + MAP_H - (i + 1) * LANE_H; }
  // ── SAFE SHAPE HELPERS (jsPDF 2.x confirmed API only) ──
  function fillTriangle(x1,y1,x2,y2,x3,y3) {
    // Draw filled triangle using three lines + fill rect approximation
    // jsPDF 2.x: use setFillColor then a thin rect as fallback for arrowheads
    const minX = Math.min(x1,x2,x3), maxX = Math.max(x1,x2,x3);
    const minY = Math.min(y1,y2,y3), maxY = Math.max(y1,y2,y3);
    doc.rect(minX, minY, maxX-minX||1, maxY-minY||1, 'F');
  }
  function rrect(x,y,w,h,style) {
    doc.rect(x, y, w, h, style || 'FD');
  }
  function diamond(cx,cy,dw,dh,style) {
    // Approximate diamond as a rotated square using rect
    // Draw as overlapping rects for a diamond silhouette
    const s = style || 'FD';
    // horizontal bar
    doc.rect(cx-dw, cy-dh*0.45, dw*2, dh*0.9, s);
  }
  function paraShape(x,y,w,h,sk,style) {
    doc.rect(x, y, w, h, style || 'FD');
  }
  function pentShape(x,y,w,h,tip,style) {
    doc.rect(x, y, w-tip/2, h, style || 'FD');
  }
  function oval(cx,cy,rx,ry,style) {
    doc.circle ? doc.circle(cx, cy, (rx+ry)/2, style||'FD') : doc.rect(cx-rx, cy-ry, rx*2, ry*2, style||'FD');
  }

  // WHITE BACKGROUND
  doc.setFillColor(255, 255, 255);
  doc.rect(0, 0, W, H, 'F');

  // TITLE BAR
  doc.setFillColor(AR, AG, AB);
  doc.rect(0, MARGIN, W, TITLE_H, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(24); doc.setFont('helvetica', 'bold');
  doc.text(D.setup.orgName || 'Organization', MARGIN + 14, MARGIN + 30);
  doc.setFontSize(13); doc.setFont('helvetica', 'normal');
  doc.text(
    (D.setup.trackName || 'Hiring process') + '  ·  ' +
    (ATS_P.find(p=>p.id===D.ats.platform)?.label || 'ATS') + '  ·  BPMN Notation',
    MARGIN + 14, MARGIN + 52
  );
  doc.setFontSize(10);
  doc.text(
    'Print: 36" × 24"  ·  300 DPI  ·  ' +
    new Date().toLocaleDateString('en-US', {month:'long', year:'numeric'}),
    W - MARGIN - 14, MARGIN + 44, { align: 'right' }
  );

  // PHASE HEADERS
  PHASES.forEach((ph, idx) => {
    const x0 = px(ph.f0), x1 = px(ph.f1);
    const lighter = idx % 2 === 1;
    doc.setFillColor(
      Math.min(255, AR + (lighter ? 22 : 0)),
      Math.min(255, AG + (lighter ? 14 : 0)),
      Math.min(255, AB + (lighter ? 22 : 0))
    );
    doc.rect(x0, MAP_TOP, x1-x0, PHASE_H, 'F');
    doc.setDrawColor(255, 255, 255);
    doc.setLineWidth(0.7);
    doc.line(x0, MAP_TOP, x0, MAP_TOP + PHASE_H);
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(8.5); doc.setFont('helvetica', 'bold');
    doc.text(ph.label, (x0+x1)/2, MAP_TOP + 17, { align: 'center' });
  });

  // LABEL COLUMN HEADER
  doc.setFillColor(AR, AG, AB);
  doc.rect(MARGIN, MAP_TOP, LABEL_W, PHASE_H, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(8); doc.setFont('helvetica', 'bold');
  doc.text('Role / Swimlane', MARGIN + LABEL_W/2, MAP_TOP + 17, { align: 'center' });

  // LABEL COLUMN BACKGROUND
  doc.setFillColor(LR, LG, LB);
  doc.rect(MARGIN, MAP_Y, LABEL_W, MAP_H, 'F');

  // LANES
  userLabels.forEach((name, i) => {
    const yb = laneBot(i);
    // White / very light gray alternating rows
    doc.setFillColor(i % 2 === 0 ? 255 : 250, i % 2 === 0 ? 255 : 249, i % 2 === 0 ? 255 : 252);
    doc.rect(MAP_X, yb, MAP_W, LANE_H, 'F');
    // Label cell — tinted
    doc.setFillColor(i % 2 === 0 ? LR : Math.max(LR-8,220), i % 2 === 0 ? LG : Math.max(LG-8,218), i % 2 === 0 ? LB : Math.max(LB-6,225));
    doc.rect(MARGIN, yb, LABEL_W, LANE_H, 'F');
    // Name
    doc.setTextColor(DR, DG, DB);
    doc.setFontSize(9); doc.setFont('helvetica', 'bold');
    const nameLines = doc.splitTextToSize(name, LABEL_W - 14);
    const lh = 11;
    const ty = yb + LANE_H/2 - (nameLines.length-1)*lh/2 + 3;
    nameLines.forEach((ln, li) => doc.text(ln, MARGIN + LABEL_W/2, ty + li*lh, { align: 'center' }));
    // Divider
    doc.setDrawColor(200, 195, 208);
    doc.setLineWidth(0.4);
    doc.line(MARGIN, yb, W-MARGIN, yb);
  });

  // PHASE COLUMN DIVIDERS
  doc.setLineDash([4, 4]);
  PHASES.forEach(ph => {
    doc.setDrawColor(210, 205, 218);
    doc.setLineWidth(0.4);
    doc.line(px(ph.f0), MAP_Y, px(ph.f0), MAP_TOP);
  });
  doc.setLineDash([]);

  // BORDERS
  doc.setDrawColor(AR, AG, AB);
  doc.setLineWidth(1.2);
  doc.line(MAP_X, MAP_Y, MAP_X, MAP_TOP + PHASE_H);
  doc.setLineWidth(2);
  doc.rect(MARGIN, MAP_Y, W-2*MARGIN, MAP_H + PHASE_H, 'S');

  // STAGE NODES
  const colW = MAP_W / Math.max(stageList.length + 1, 9);
  const TW = Math.min(colW * 0.82, 120), TH = 30;

  stageList.forEach((stage, si) => {
    const laneIdx = si % Math.max(userLabels.length, 1);
    const cx = MAP_X + (si + 0.9) * colW + colW * 0.35;
    const cy = laneCY(laneIdx);
    const a = D.actions[stage.id];
    const sp = D.subprocess[stage.id];
    const hasSP = sp?.hasSubprocess === true;

    // Task rectangle — white fill, brand color stroke
    doc.setFillColor(255, 255, 255);
    doc.setDrawColor(AR, AG, AB);
    doc.setLineWidth(hasSP ? 1.8 : 1);
    if (hasSP) doc.setLineDash([5, 2]); else doc.setLineDash([]);
    rrect(cx - TW/2, cy - TH/2, TW, TH, 'FD');
    doc.setLineDash([]);

    // [+] sub-process badge
    if (hasSP) {
      doc.setFillColor(AR, AG, AB);
      rrect(cx - TW/2 + 3, cy - TH/2 + 3, 18, 11, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(6.5); doc.setFont('helvetica', 'bold');
      doc.text('[+]', cx - TW/2 + 12, cy - TH/2 + 11, { align: 'center' });
    }

    // Label
    doc.setTextColor(DR, DG, DB);
    doc.setFontSize(8); doc.setFont('helvetica', hasSP ? 'bold' : 'normal');
    const lblLines = doc.splitTextToSize(stage.label, TW - 12);
    const lh = 10;
    const ly = cy - (lblLines.length - 1) * lh / 2 + 2;
    lblLines.forEach((ln, li) => doc.text(ln, cx, ly + li*lh, { align: 'center' }));

    // Forward arrow to next node in same lane
    const nextSI = stageList.findIndex((s, idx) => idx > si && (idx % Math.max(userLabels.length,1)) === laneIdx);
    if (nextSI > -1) {
      const nCX = MAP_X + (nextSI + 0.9) * colW + colW * 0.35;
      doc.setDrawColor(160, 148, 172);
      doc.setLineWidth(0.8);
      doc.line(cx + TW/2 + 1, cy, nCX - TW/2 - 8, cy);
      doc.setFillColor(160, 148, 172);
      fillTriangle(nCX-TW/2-8, cy-3.5, nCX-TW/2-8, cy+3.5, nCX-TW/2-2, cy);
    }

    // Decision diamond
    if (a && a.outcomes.length > 0) {
      const dx = cx + TW/2 + 28, dw = 18, dh = 13;
      doc.setFillColor(225, 240, 252);
      doc.setDrawColor(24, 95, 165);
      doc.setLineWidth(0.9);
      diamond(dx, cy, dw, dh, 'FD');
      doc.setTextColor(4, 44, 83);
      doc.setFontSize(7); doc.setFont('helvetica', 'bold');
      doc.text('?', dx, cy + 2.5, { align: 'center' });

      // Yes path
      if (a.outcomes.includes('advance') || a.outcomes.includes('approve')) {
        doc.setDrawColor(30, 120, 70);
        doc.setLineWidth(1.3);
        doc.line(dx + dw + 2, cy, dx + dw + 24, cy);
        doc.setFillColor(30, 120, 70);
        fillTriangle(dx+dw+18, cy-3.5, dx+dw+18, cy+3.5, dx+dw+24, cy);
        doc.setTextColor(30, 120, 70);
        doc.setFontSize(7.5); doc.setFont('helvetica', 'bold');
        doc.text('Yes', dx + dw + 13, cy - 5, { align: 'center' });
      }

      // No path (downward)
      if (a.outcomes.includes('reject')) {
        doc.setDrawColor(170, 35, 25);
        doc.setLineWidth(1.3);
        doc.line(dx, cy + dh + 2, dx, cy + dh + 22);
        doc.setFillColor(170, 35, 25);
        fillTriangle(dx-3.5, cy+dh+16, dx+3.5, cy+dh+16, dx, cy+dh+22);
        doc.setTextColor(170, 35, 25);
        doc.setFontSize(7.5); doc.setFont('helvetica', 'bold');
        doc.text('No', dx + 6, cy + dh + 17);
      }
    }
  });

  // INTEGRATION BADGES
  if (integLabels.length > 0) {
    const badgeY = MAP_Y + LANE_H * 0.18;
    integLabels.slice(0, 6).forEach((integ, i) => {
      const ix = MAP_X + 14 + i * 168;
      doc.setFillColor(232, 244, 255);
      doc.setDrawColor(100, 148, 200);
      doc.setLineWidth(0.6);
      rrect(ix, badgeY - 8, 156, 16, 'FD');
      doc.setTextColor(24, 70, 130);
      doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
      doc.text(integ, ix + 78, badgeY + 4, { align: 'center' });
    });
  }

  // LEGEND STRIP
  const legY = H - MARGIN - FOOTER_H - LEGEND_H - 2;
  doc.setFillColor(248, 247, 250);
  doc.setDrawColor(200, 195, 210);
  doc.setLineWidth(0.5);
  doc.rect(MARGIN, legY, W - 2*MARGIN, LEGEND_H, 'FD');

  const legItems = [
    { label: 'Start event',       fillRGB: [234,243,222], strokeRGB: [59,109,17],  shape: 'oval' },
    { label: 'End: hired',        fillRGB: [234,243,222], strokeRGB: [59,109,17],  shape: 'oval', thick: true },
    { label: 'End: exit',         fillRGB: [252,235,235], strokeRGB: [163,45,45],  shape: 'oval', thick: true },
    { label: 'Task',              fillRGB: [255,255,255], strokeRGB: [AR,AG,AB],   shape: 'rect' },
    { label: 'Decision gateway',  fillRGB: [225,240,252], strokeRGB: [24,95,165],  shape: 'diamond' },
    { label: 'Data in / out',     fillRGB: [250,238,218], strokeRGB: [133,79,11],  shape: 'para' },
    { label: 'Cross-lane handoff',fillRGB: [238,237,254], strokeRGB: [83,74,183],  shape: 'pent' },
    { label: 'Approved path',     fillRGB: [30,120,70],   strokeRGB: [30,120,70],  shape: 'arrow' },
    { label: 'Rejected path',     fillRGB: [170,35,25],   strokeRGB: [170,35,25],  shape: 'arrow' },
    { label: '[+] Sub-process',   fillRGB: [255,255,255], strokeRGB: [AR,AG,AB],   shape: 'rect', dashed: true },
  ];

  const legStep = (W - 2*MARGIN) / legItems.length;
  legItems.forEach((item, i) => {
    const lx = MARGIN + i * legStep + legStep/2;
    const ly = legY + LEGEND_H/2 - 2;
    doc.setFillColor(...item.fillRGB);
    doc.setDrawColor(...item.strokeRGB);
    doc.setLineWidth(item.thick ? 2.2 : 0.8);
    if (item.dashed) doc.setLineDash([3,2]); else doc.setLineDash([]);

    switch(item.shape) {
      case 'oval':
        oval(lx, ly, 14, 8, 'FD'); break;
      case 'rect':
        rrect(lx-14, ly-7, 28, 14, 'FD'); break;
      case 'diamond':
        diamond(lx, ly, 12, 8, 'FD'); break;
      case 'para':
        paraShape(lx-14, ly-7, 28, 14, 7, 'FD'); break;
      case 'pent':
        pentShape(lx-14, ly-7, 28, 14, 8, 'FD'); break;
      case 'arrow':
        doc.setDrawColor(...item.strokeRGB); doc.setLineWidth(1.5);
        doc.line(lx-14, ly, lx+6, ly);
        doc.setFillColor(...item.fillRGB);
        fillTriangle(lx+6, ly-3.5, lx+6, ly+3.5, lx+14, ly); break;
    }
    doc.setLineDash([]);
    doc.setTextColor(80, 72, 92);
    doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
    doc.text(item.label, lx, legY + LEGEND_H - 3, { align: 'center' });
  });

  // FOOTER
  doc.setTextColor(130, 120, 145);
  doc.setFontSize(8); doc.setFont('helvetica', 'normal');
  doc.text(
    (D.setup.orgName||'Organization') + '  ·  ' + (D.setup.trackName||'Hiring process') +
    '  ·  CONFIDENTIAL  ·  One map = one process track',
    MARGIN + 12, H - MARGIN + 6
  );
  doc.text(
    'Generated ' + new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) +
    '  ·  TA Process Mapping Tool — TASSP Playbook',
    W - MARGIN - 12, H - MARGIN + 6, { align: 'right' }
  );

  // DOWNLOAD
  const fileName = ((D.setup.orgName||'TA')+'_'+(D.setup.trackName||'Process')+'_Map.pdf').replace(/\s+/g,'_');
  doc.save(fileName);
}

// ── DOCX SOP GENERATOR ────────────────────────────────────────────────────────
async function generateDOCX() {
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
          HeadingLevel, AlignmentType, BorderStyle, WidthType, ShadingType,
          LevelFormat } = docx;

  const userLabels = [...D.users.selected.map(u => USERS.find(o=>o.id===u)?.label||u), ...D.users.custom];
  const stageList = getStageList();
  const integLabels = [...D.integrations.selected.map(i => INTEGS.find(o=>o.id===i)?.label||i), ...D.integrations.custom];
  const spStages = stageList.filter(s => D.subprocess[s.id]?.hasSubprocess === true);
  const reqOpenLabels = D.reqflow.reqOpenMethod.map(m => REQ_OPEN.find(o=>o.id===m)?.label||m);

  const BRAND_HEX = AC.replace('#','');
  const border = { style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC' };
  const borders = { top: border, bottom: border, left: border, right: border };
  const noBorder = { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' };
  const noBorders = { top: noBorder, bottom: noBorder, left: noBorder, right: noBorder };

  function h1(text) {
    return new Paragraph({
      heading: HeadingLevel.HEADING_1,
      spacing: { before: 320, after: 100 },
      border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: BRAND_HEX, space: 4 } },
      children: [new TextRun({ text, bold: true, size: 32, color: BRAND_HEX, font: 'Arial' })]
    });
  }
  function h2(text) {
    return new Paragraph({
      heading: HeadingLevel.HEADING_2,
      spacing: { before: 220, after: 80 },
      children: [new TextRun({ text, bold: true, size: 26, color: '333333', font: 'Arial' })]
    });
  }
  function body(text, opts = {}) {
    return new Paragraph({
      spacing: { before: 60, after: 60 },
      children: [new TextRun({ text, size: 20, color: '222222', font: 'Arial', ...opts })]
    });
  }
  function bullet(text) {
    return new Paragraph({
      numbering: { reference: 'bullets', level: 0 },
      spacing: { before: 40, after: 40 },
      children: [new TextRun({ text, size: 20, color: '222222', font: 'Arial' })]
    });
  }
  function spacer() { return new Paragraph({ spacing: { before: 0, after: 0 }, children: [new TextRun('')] }); }

  function hdrRow(cells, widths) {
    return new TableRow({ tableHeader: true, children: cells.map((t, i) =>
      new TableCell({ borders, width: { size: widths[i], type: WidthType.DXA },
        shading: { fill: BRAND_HEX, type: ShadingType.CLEAR },
        margins: { top: 80, bottom: 80, left: 120, right: 120 },
        children: [new Paragraph({ children: [new TextRun({ text: t, bold: true, size: 18, color: 'FFFFFF', font: 'Arial' })] })]
      })
    )});
  }
  function dataRow(cells, widths, shade = false) {
    return new TableRow({ children: cells.map((t, i) =>
      new TableCell({ borders, width: { size: widths[i], type: WidthType.DXA },
        shading: { fill: shade ? 'F5F5F5' : 'FFFFFF', type: ShadingType.CLEAR },
        margins: { top: 80, bottom: 80, left: 120, right: 120 },
        children: [new Paragraph({ children: [new TextRun({ text: String(t), size: 18, color: '333333', font: 'Arial' })] })]
      })
    )});
  }

  const doc2 = new Document({
    styles: {
      default: { document: { run: { font: 'Arial', size: 20 } } },
      paragraphStyles: [
        { id: 'Heading1', name: 'Heading 1', basedOn: 'Normal', next: 'Normal',
          run: { size: 32, bold: true, font: 'Arial', color: BRAND_HEX },
          paragraph: { spacing: { before: 320, after: 100 }, outlineLevel: 0 } },
        { id: 'Heading2', name: 'Heading 2', basedOn: 'Normal', next: 'Normal',
          run: { size: 26, bold: true, font: 'Arial' },
          paragraph: { spacing: { before: 220, after: 80 }, outlineLevel: 1 } },
      ]
    },
    numbering: { config: [
      { reference: 'bullets', levels: [{ level: 0, format: LevelFormat.BULLET, text: '•',
          alignment: AlignmentType.LEFT, style: { paragraph: { indent: { left: 720, hanging: 360 } } } }] },
    ]},
    sections: [{ properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } },
      children: [
        // Cover
        new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 720, after: 120 },
          children: [new TextRun({ text: 'TALENT ACQUISITION', font: 'Arial', size: 18, bold: true, color: BRAND_HEX })] }),
        new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 0, after: 160 },
          children: [new TextRun({ text: 'Standard Operating Procedure', font: 'Arial', size: 48, bold: true })] }),
        new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 0, after: 80 },
          children: [new TextRun({ text: D.setup.orgName || 'Organization', font: 'Arial', size: 32, color: BRAND_HEX })] }),
        new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 0, after: 480 },
          children: [new TextRun({ text: (D.setup.trackName || 'Hiring process') + '  ·  ' + (ATS_P.find(p=>p.id===D.ats.platform)?.label || 'ATS'), font: 'Arial', size: 22, color: '777777' })] }),
        spacer(), spacer(),

        // Section 1
        h1('1. Purpose and scope'),
        body('This Standard Operating Procedure defines the end-to-end talent acquisition process for ' + (D.setup.trackName || 'this hiring track') + ' at ' + (D.setup.orgName || 'this organization') + '. It establishes roles, responsibilities, system touchpoints, and the workflow sequence governing how candidates move from requisition creation through to onboarding handoff.'),
        spacer(),
        body('This document applies to all ' + (D.setup.trackName || '') + ' requisitions processed through ' + (ATS_P.find(p=>p.id===D.ats.platform)?.label || 'the ATS') + ' and is intended for use by all system users identified in Section 3.'),
        spacer(),

        // Section 2
        h1('2. Key terminology'),
        new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [2200, 7160], rows: [
          hdrRow(['Term', 'Definition used in this organization'], [2200, 7160]),
          dataRow(['Job opening', D.terms.req || 'Requisition'], [2200, 7160]),
          dataRow(['Applicant', D.terms.candidate || 'Candidate'], [2200, 7160], true),
          dataRow(['Rejection term', D.terms.disposition || 'Disposition'], [2200, 7160]),
          dataRow(['First interaction', D.terms.screen || 'Phone screen'], [2200, 7160], true),
          dataRow(['Offer stage', D.terms.offer || 'Offer'], [2200, 7160]),
          dataRow(['Department manager', D.terms.hm || 'Hiring manager'], [2200, 7160], true),
        ]}),
        spacer(),

        // Section 3
        h1('3. System users and swimlane responsibilities'),
        new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [2800, 6560], rows: [
          hdrRow(['Role', 'Primary responsibility'], [2800, 6560]),
          ...userLabels.map((u, i) => {
            const a = Object.values(D.actions).find(a => a.decisionOwners?.includes(u));
            const desc = a ? 'Decision owner at: ' + Object.entries(D.actions).filter(([,v]) => v.decisionOwners?.includes(u)).map(([,v]) => v.label).join(', ') : 'System user — participates in hiring process';
            return dataRow([u, desc], [2800, 6560], i % 2 === 1);
          })
        ]}),
        spacer(),

        // Section 4
        h1('4. Requisition opening'),
        body('How requisitions are opened: ' + (reqOpenLabels.join(', ') || 'Not specified')),
        D.reqflow.reqOpenNote ? body(D.reqflow.reqOpenNote, { italics: true, color: '555555' }) : spacer(),
        D.reqflow.hasApproval ? h2('4.1 Requisition approval chain') : spacer(),
        D.reqflow.hasApproval ? body('Requisitions require approval before posting. Approval chain: ' + [...D.reqflow.approvers, ...D.reqflow.customApprovers].join(' → ')) : spacer(),
        spacer(),

        // Section 5
        h1('5. Candidate pipeline stages'),
        body('The following stages exist in the ' + (D.setup.trackName || '') + ' candidate pipeline:'),
        ...stageList.map(s => {
          const a = D.actions[s.id];
          const sp = D.subprocess[s.id];
          const lines = [bullet(s.label + (a?.decisionOwners?.length ? ' — Decision owner: ' + a.decisionOwners.join(', ') : '') + (a?.outcomes?.length ? ' — Outcomes: ' + a.outcomes.join(' / ') : ''))];
          if(sp?.hasSubprocess && sp.rounds.length) {
            sp.rounds.forEach((r, ri) => {
              lines.push(new Paragraph({
                numbering: { reference: 'bullets', level: 0 },
                spacing: { before: 20, after: 20 },
                indent: { left: 1080 },
                children: [new TextRun({ text: 'Round ' + (ri+1) + ': ' + r.name + (r.types?.length ? ' · ' + r.types.join('/') : '') + (r.formats?.length ? ' · ' + r.formats.join('/') : '') + (r.conductors?.length ? ' · Conducted by: ' + r.conductors.join(', ') : '') + (r.condition ? ' · Only if: ' + r.condition : ''), size: 18, color: '555555', font: 'Arial' })]
              }));
            });
          }
          return lines;
        }).flat(),
        spacer(),

        // Section 6
        h1('6. Integrations and system touchpoints'),
        integLabels.length ? new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [3000, 6360], rows: [
          hdrRow(['Integration', 'Function'], [3000, 6360]),
          ...integLabels.map((integ, i) => dataRow([integ, 'Connected to ' + (ATS_P.find(p=>p.id===D.ats.platform)?.label || 'ATS') + ' — used during the hiring process'], [3000, 6360], i % 2 === 1))
        ]}) : body('No integrations defined.'),
        spacer(),

        // Section 7 — RACI
        h1('7. RACI — responsibility assignment matrix'),
        body('R = Responsible, A = Accountable, C = Consulted, I = Informed'),
        spacer(),
        new Table({
          width: { size: 9360, type: WidthType.DXA },
          columnWidths: [2400, ...userLabels.slice(0,5).map(() => Math.floor(6960 / Math.min(userLabels.length, 5)))],
          rows: [
            hdrRow(['Activity', ...userLabels.slice(0,5)], [2400, ...userLabels.slice(0,5).map(() => Math.floor(6960/Math.min(userLabels.length,5)))]),
            ...stageList.map((s, si) => {
              const a = D.actions[s.id];
              const cells = userLabels.slice(0,5).map(u => {
                if(a?.decisionOwners?.includes(u)) return 'A/R';
                if(a?.rejectOwner?.includes(u)) return 'R';
                return 'I';
              });
              return dataRow([s.label, ...cells], [2400, ...userLabels.slice(0,5).map(() => Math.floor(6960/Math.min(userLabels.length,5)))], si % 2 === 1);
            })
          ]
        }),
        spacer(),

        // Section 8 — Sub-processes
        ...(spStages.length ? [
          h1('8. Sub-process documentation'),
          body('The following stages contain expanded sub-processes with multiple steps or rounds:'),
          spacer(),
          ...spStages.flatMap(s => {
            const sp = D.subprocess[s.id];
            return [
              h2('8.' + (spStages.indexOf(s)+1) + ' ' + s.label),
              body('This stage contains ' + sp.rounds.length + ' round' + (sp.rounds.length !== 1 ? 's' : '') + ' with pass/fail gates between each.'),
              spacer(),
              new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [1400, 1400, 1600, 1800, 1600, 1560], rows: [
                hdrRow(['Round', 'Type', 'Format', 'Conducted by', 'Scheduling', 'Condition'], [1400,1400,1600,1800,1600,1560]),
                ...sp.rounds.map((r, ri) => dataRow([
                  'Round ' + (ri+1) + ': ' + r.name,
                  r.types?.map(t => ITYPES.find(x=>x.id===t)?.label||t).join('/') || '—',
                  r.formats?.map(f => FORMATS.find(x=>x.id===f)?.label||f).join('/') || '—',
                  r.conductors?.join(', ') || '—',
                  r.schedMethod?.map(m => SCHED.find(x=>x.id===m)?.label||m).join('/') || '—',
                  r.condition || 'All candidates',
                ], [1400,1400,1600,1800,1600,1560], ri % 2 === 1))
              ]}),
              spacer(),
            ];
          }),
        ] : []),

        // Section 9 — Document info
        h1((spStages.length ? '9' : '8') + '. Document information'),
        new Table({ width: { size: 9360, type: WidthType.DXA }, columnWidths: [2400, 6960], rows: [
          dataRow(['Document owner', (D.setup.orgName || 'Organization') + ' — TA Operations'], [2400, 6960]),
          dataRow(['Process track', D.setup.trackName || 'Not specified'], [2400, 6960], true),
          dataRow(['ATS platform', ATS_P.find(p=>p.id===D.ats.platform)?.label || 'Not specified'], [2400, 6960]),
          dataRow(['Generated', new Date().toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})], [2400, 6960], true),
          dataRow(['Generated by', 'TA Process Mapping Tool — TASSP Playbook'], [2400, 6960]),
          dataRow(['Status', 'Draft — pending stakeholder review'], [2400, 6960], true),
        ]}),
        spacer(),
        body('This document was generated from structured process data captured via the TA Process Mapping Tool at TASSP Playbook. Review with all stakeholders before finalizing.', { italics: true, color: '888888' }),
      ]
    }]
  });

  const blob = await Packer.toBlob(doc2);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = ((D.setup.orgName || 'TA') + '_' + (D.setup.trackName || 'Process') + '_SOP.docx').replace(/\s+/g, '_');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function hexToRgbArr(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r, g, b];
}

// ── BEFOREUNLOAD — warn if session has unsaved progress ──────────────────────
window.addEventListener('beforeunload', function(e) {
  if (!HAS_INTERACTION || SAVE_STATUS === 'saved') return;
  const msg = 'You have unsaved progress. Are you sure you want to leave?';
  e.preventDefault();
  e.returnValue = msg;
  return msg;
});

(async function init(){
  applyAC(AC);
  await initSession();
  if(!document.getElementById('main').querySelector('.resume-card')) render();
  // Start timestamp updater if we already have a saved session
  if (SESSION_ID) {
    LAST_SAVED_AT = new Date();
    startTimestampInterval();
    setSaveStatus('saved');
  }
})();
