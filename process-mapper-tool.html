<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ac: #0D7377;
    --ac-bg: rgba(13,115,119,0.06);
    --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --bg: #ffffff;
    --bg2: #f8f7f4;
    --bg3: #f1efe8;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --radius: 8px;
    --radius-lg: 12px;
    --space-xs: 6px;
    --space-sm: 10px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #242422; --bg3: #2c2c2a;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --text: #e8e6de; --text2: #a8a69e; --text3: #6e6c66;
    }
  }
  body { font-family: var(--font); background: var(--bg3); color: var(--text); font-size: 15px; line-height: 1.5; }

  /* ── LAYOUT ── */
  #shell { max-width: 860px; margin: 0 auto; min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--ac); color: #fff; padding: 16px var(--space-xl); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 52px; z-index: 100; }
  .hdr-left { display: flex; align-items: center; gap: 14px; }
  .hdr-logo { width: 34px; height: 34px; background: rgba(255,255,255,.18); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; letter-spacing: .03em; }
  .hdr-title { font-size: 14px; font-weight: 500; }
  .hdr-sub { font-size: 11px; opacity: .6; margin-top: 2px; letter-spacing: .01em; }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  .save-indicator { font-size: 11px; opacity: .85; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 20px; }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: #7fff7f; flex-shrink: 0; }
  .save-dot.saving { background: #ffdd44; animation: pulse .8s ease-in-out infinite; }
  .save-dot.error { background: #ff6b6b; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

  /* ── PROGRESS BAR ── */
  .pbar-wrap { height: 2px; background: rgba(0,0,0,.06); }
  .pbar-fill { height: 100%; background: var(--ac); transition: width .45s cubic-bezier(.4,0,.2,1); }

  /* ── STEP NAV ── */
  .snav { background: var(--bg2); border-bottom: 0.5px solid var(--border); padding: 0 var(--space-xl); display: flex; overflow-x: auto; gap: 0; }
  .snav::-webkit-scrollbar { display: none; }
  .nitem { padding: 12px 13px 10px; font-size: 11px; color: var(--text3); border-bottom: 2px solid transparent; cursor: default; white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: all .15s; letter-spacing: .01em; }
  .nitem.done { color: #3B6D11; cursor: pointer; }
  .nitem.done:hover { color: #27500A; }
  .nitem.active { color: var(--ac); border-bottom-color: var(--ac); font-weight: 500; }
  .ndot { width: 17px; height: 17px; border-radius: 50%; background: var(--bg3); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; flex-shrink: 0; }
  .nitem.done .ndot { background: #EAF3DE; border-color: #3B6D11; color: #27500A; }
  .nitem.active .ndot { background: var(--ac); border-color: var(--ac); color: #fff; }

  /* ── MAIN CONTENT AREA ── */
  .main { padding: var(--space-xl); }

  /* ── QUESTION CARD ── */
  .qcard { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: var(--space-xl); animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

  /* ── TYPOGRAPHY SYSTEM ── */
  .qstep { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: var(--space-md); display: flex; align-items: center; gap: 7px; }
  .qstep-num { width: 18px; height: 18px; border-radius: 50%; background: var(--bg2); border: 0.5px solid var(--border2); font-size: 10px; font-weight: 500; color: var(--text2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .qheading { font-size: 22px; font-weight: 500; color: var(--text); line-height: 1.3; margin-bottom: 8px; }
  .qsubhead { font-size: 13px; color: var(--text2); margin-bottom: var(--space-lg); line-height: 1.65; }
  .qlabel { font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ac); margin-bottom: 10px; }
  .qtext { font-size: 17px; font-weight: 500; margin-bottom: 6px; color: var(--text); line-height: 1.4; }
  .qhint { font-size: 13px; color: var(--text2); margin-bottom: var(--space-lg); line-height: 1.6; }
  .qsec-label { font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); margin-bottom: var(--space-sm); }

  /* ── TRACK CARD GRID (Step 1) ── */
  .track-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 9px; margin-bottom: var(--space-md); }
  .track-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; cursor: pointer; transition: border-color .12s, background .12s; }
  .track-card:hover { border-color: var(--border2); }
  .track-card.sel { border: 0.5px solid var(--ac); background: var(--ac-bg); }
  .track-card-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; margin-bottom: 9px; }
  .track-card-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
  .track-card-desc { font-size: 11px; color: var(--text2); line-height: 1.4; }

  /* ── MODE CARDS (Step 1) ── */
  .mode-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 9px; }
  .mode-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; cursor: pointer; transition: border-color .12s, background .12s; }
  .mode-card:hover { border-color: var(--border2); }
  .mode-card.sel { border: 0.5px solid var(--ac); background: var(--ac-bg); }
  .mode-card-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
  .mode-card-badge { font-size: 11px; font-weight: 400; color: var(--text3); }
  .mode-card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }

  /* ── SECTION DIVIDER ── */
  .qdivider { height: 0.5px; background: var(--border); margin: var(--space-lg) 0; }

  /* ── OPTIONS (list-style, non-track steps) ── */
  .opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: var(--space-sm); }
  .opt { display: flex; align-items: flex-start; gap: 13px; padding: 13px 16px; border: 0.5px solid var(--border); border-radius: 10px; cursor: pointer; transition: border-color .12s, background .12s; background: var(--bg); user-select: none; }
  .opt:hover { border-color: var(--border2); }
  .opt.sel { border-color: var(--ac); background: var(--ac-bg); }
  .chk { width: 18px; height: 18px; min-width: 18px; border: 0.5px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-top: 2px; background: var(--bg); transition: all .12s; flex-shrink: 0; }
  .opt.sel .chk { background: var(--ac); border-color: var(--ac); }
  .chkm { display: none; font-size: 11px; color: #fff; font-weight: 600; }
  .opt.sel .chkm { display: block; }
  .rad { width: 18px; height: 18px; min-width: 18px; border: 0.5px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 2px; background: var(--bg); flex-shrink: 0; }
  .opt.sel .rad { border-color: var(--ac); }
  .radd { width: 8px; height: 8px; border-radius: 50%; display: none; background: var(--ac); }
  .opt.sel .radd { display: block; }
  .ol { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .od { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.5; }

  /* ── INPUTS ── */
  .mini { width: 100%; font-size: 13px; padding: 10px 13px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: var(--font); transition: border-color .12s; }
  .mini:focus { outline: none; border-color: var(--ac); }
  .mini::placeholder { color: var(--text3); }
  .addc { display: flex; gap: 8px; margin-top: 8px; }
  .addc input { flex: 1; font-size: 13px; padding: 10px 13px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: var(--font); transition: border-color .12s; }
  .addc input::placeholder { color: var(--text3); }
  .addc input:focus { outline: none; border-color: var(--ac); }
  .addc button, .btn-ac { padding: 10px 18px; color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-family: var(--font); background: var(--ac); transition: opacity .12s; font-weight: 500; }
  .addc button:hover, .btn-ac:hover { opacity: .88; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text); }
  .tx { cursor: pointer; color: var(--text3); font-size: 14px; }
  .tx:hover { color: var(--ac); }

  /* ── FOOTER NAV ── */
  .fnav { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-lg); padding-top: var(--space-lg); border-top: 0.5px solid var(--border); }
  .bbtn { padding: 9px 16px; background: transparent; border: none; border-radius: var(--radius); font-size: 13px; cursor: pointer; color: var(--text3); font-family: var(--font); transition: color .12s; }
  .bbtn:hover { color: var(--text); }
  .nbtn { padding: 10px 22px; color: #fff; border: none; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 500; font-family: var(--font); display: flex; align-items: center; gap: 7px; background: var(--ac); transition: opacity .12s; }
  .nbtn:hover { opacity: .88; }
  .nbtn:disabled { opacity: .35; cursor: default; }
  .qctr { font-size: 12px; color: var(--text3); }

  /* ── PERSISTENT SAVE FOOTER (replaces per-card save panel) ── */
  .save-footer { margin-top: var(--space-lg); padding: 13px var(--space-xl); background: var(--bg2); border-top: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .save-footer-label { font-size: 12px; color: var(--text3); }
  .save-footer-row { display: flex; gap: 7px; flex: 1; max-width: 400px; }
  .save-footer-row input { flex: 1; font-size: 12px; padding: 7px 11px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: var(--font); }
  .save-footer-row input:focus { outline: none; border-color: var(--ac); }
  .save-footer-row input::placeholder { color: var(--text3); }
  .save-footer-btn { padding: 7px 14px; font-size: 12px; color: #fff; background: var(--ac); border: none; border-radius: var(--radius); cursor: pointer; font-family: var(--font); font-weight: 500; white-space: nowrap; transition: opacity .12s; }
  .save-footer-btn:hover { opacity: .88; }
  .save-footer-success { font-size: 12px; color: #3B6D11; display: none; }

  /* ── EMAIL SAVE PANEL (kept for backwards compat, hidden by default) ── */
  .save-panel { display: none; }

  /* ── RESUME SCREEN ── */
  .resume-screen { padding: 48px var(--space-xl); text-align: center; }
  .resume-card { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 36px; max-width: 520px; margin: 0 auto; }
  .resume-icon { width: 52px; height: 52px; background: var(--ac-bg); border: 0.5px solid var(--ac); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .resume-title { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .resume-meta { font-size: 13px; color: var(--text2); margin-bottom: 22px; line-height: 1.6; }
  .resume-detail { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .resume-detail:last-child { border-bottom: none; }
  .resume-detail span:first-child { color: var(--text2); }
  .resume-detail span:last-child { font-weight: 500; }
  .resume-details-block { background: var(--bg2); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 22px; }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a18; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; transition: transform .3s ease; z-index: 999; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── COPY LINK ── */
  .link-box { display: flex; gap: 8px; margin-top: 12px; }
  .link-input { flex: 1; font-size: 12px; padding: 8px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg2); color: var(--text2); font-family: monospace; }
  .copy-btn { padding: 8px 14px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 12px; cursor: pointer; color: var(--text2); font-family: var(--font); transition: all .12s; white-space: nowrap; }
  .copy-btn:hover { border-color: var(--ac); color: var(--ac); }

  /* ── CALLOUT ── */
  .callout { border-radius: 0; border-left: 3px solid; padding: 13px 16px; margin-bottom: var(--space-md); }
  .callout.info { background: #f0f7ff; border-color: #185FA5; }
  .callout.info p { font-size: 13px; color: #0C447C; line-height: 1.55; }
  @media (prefers-color-scheme: dark) {
    .callout.info { background: #0d1f35; }
    .callout.info p { color: #85B7EB; }
  }

  /* ── EDITABLE OPTION LABELS ── */
  .opt-edit-btn { background:none;border:none;cursor:pointer;padding:2px 5px;color:var(--text3);font-size:12px;border-radius:3px;margin-left:4px;opacity:0;transition:opacity .12s; }
  .opt.sel .opt-edit-btn { opacity:1; }
  .opt.sel:hover .opt-edit-btn { color:var(--ac); }
  .opt-edit-btn:hover { color:var(--ac)!important; }
  .opt-label-wrap { display:flex;align-items:center;flex:1; }
  .opt-inline-input { font-size:14px;font-family:var(--font);border:none;border-bottom:1.5px solid var(--ac);background:transparent;color:var(--text);padding:0 2px;width:100%;outline:none; }
  .opt-custom-badge { font-size:10px;padding:1px 5px;background:var(--ac-bg);border:0.5px solid var(--ac);border-radius:3px;color:var(--ac);margin-left:5px; }
</style>
</head>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// SUPABASE CLIENT
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://fpenseudntsilynmhwje.supabase.co';
const SUPABASE_ANON = 'sb_publishable_rgWAZAaMLHFP548XcR1oVg_kEx-nKKr';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ─────────────────────────────────────────────────────────────────────────────
// SESSION STATE
// ─────────────────────────────────────────────────────────────────────────────
let SESSION_ID = null;
let RESUME_TOKEN = null;
let SAVE_TIMEOUT = null;
let SAVE_STATUS = 'idle';
let HAS_INTERACTION = false;
let LAST_SAVED_AT = null;
let AUTOSAVE_INTERVAL = null;
let TIMESTAMP_INTERVAL = null;

// Generate or load resume token from URL
function getOrCreateToken() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('token')) return params.get('token');
  // Generate a UUID v4
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// Push resume token to URL without reload
function setTokenInURL(token) {
  const url = new URL(window.location.href);
  url.searchParams.set('token', token);
  window.history.replaceState({}, '', url.toString());
}

// Set auth header for RLS
function getHeaders() {
  return { 'x-resume-token': RESUME_TOKEN };
}

// ─────────────────────────────────────────────────────────────────────────────
// SAVE / LOAD
// ─────────────────────────────────────────────────────────────────────────────
async function initSession() {
  RESUME_TOKEN = getOrCreateToken();
  setTokenInURL(RESUME_TOKEN);

  // Try to load existing session
  const { data: existing } = await sb
    .from('sessions')
    .select('id, org_name, track_name, mode, accent_color, current_section, status')
    .eq('resume_token', RESUME_TOKEN)
    .single();

  if (existing) {
    SESSION_ID = existing.id;
    // Load all section data
    const { data: sections } = await sb
      .from('session_data')
      .select('section, data')
      .eq('session_id', SESSION_ID);

    if (sections) {
      sections.forEach(s => {
        if (D[s.section]) Object.assign(D[s.section], s.data);
      });
    }
    // Restore position
    if (existing.current_section) {
      const idx = activeSecs.indexOf(existing.current_section);
      if (idx > -1) cs = idx;
    }
    if (existing.accent_color) applyAC(existing.accent_color);
    if (existing.org_name) D.setup.orgName = existing.org_name;
    showResumeScreen(existing);
    return;
  }

  // Create new session
  const { data: newSession, error } = await sb
    .from('sessions')
    .insert({
      resume_token: RESUME_TOKEN,
      track_name: D.setup.trackName || '',
      mode: mode,
      accent_color: AC,
      current_section: 'setup',
      status: 'in_progress'
    })
    .select('id')
    .single();

  if (newSession) {
    SESSION_ID = newSession.id;
    setSaveStatus('saved');
  } else {
    console.warn('Session create failed:', error);
    setSaveStatus('error');
  }
}

async function saveSection(section) {
  if (!SESSION_ID || !RESUME_TOKEN) return;
  setSaveStatus('saving');
  clearTimeout(SAVE_TIMEOUT);
  SAVE_TIMEOUT = setTimeout(async () => {
    try {
      // Upsert section data
      const { error: dataErr } = await sb
        .from('session_data')
        .upsert({
          session_id: SESSION_ID,
          section: section,
          data: D[section] || {},
          saved_at: new Date().toISOString()
        }, { onConflict: 'session_id,section' });

      // Update session metadata
      const updates = {
        current_section: activeSecs[cs] || section,
        updated_at: new Date().toISOString(),
      };
      if (D.setup.orgName) updates.org_name = D.setup.orgName;
      if (D.setup.trackName) updates.track_name = D.setup.trackName;
      if (D.setup.mode) updates.mode = D.setup.mode;
      if (AC) updates.accent_color = AC;

      const { error: sessErr } = await sb
        .from('sessions')
        .update(updates)
        .eq('resume_token', RESUME_TOKEN);

      setSaveStatus(dataErr || sessErr ? 'error' : 'saved');
    } catch(e) {
      setSaveStatus('error');
    }
  }, 600);
}

async function saveEmail(email) {
  if (!SESSION_ID || !email) return;
  const { error } = await sb
    .from('sessions')
    .update({ email })
    .eq('resume_token', RESUME_TOKEN);
  if (!error) {
    await sendResumeEmail(email);
    return true;
  }
  return false;
}

  if (!ind) return;
  ind.style.display = 'flex';

  updateSaveLabel();
}
function updateSaveLabel() {
  var lbl = document.getElementById('save-label');
  if (!lbl) return;
  if (SAVE_STATUS === 'saving') { lbl.textContent = 'Saving…'; return; }
  if (SAVE_STATUS === 'error') { lbl.textContent = 'Save error'; return; }
  if (!LAST_SAVED_AT) { lbl.textContent = 'Not saved yet'; return; }
  var secs = Math.floor((new Date() - LAST_SAVED_AT) / 1000);
  lbl.textContent = secs < 5 ? 'Saved just now' : secs < 60 ? 'Saved ' + secs + 's ago' : 'Saved ' + Math.floor(secs/60) + 'm ago';
}

}

function rStages(){
  // Step 7: Define statuses within each stage
  // Stages are locked in from ATS section
  var stages = getStageList();
  if (!stages.length) {
    qc(sl('Stages & statuses') + qt('No stages found') + qh('Please go back to the ATS section and define your stages first.') + fnav('ns','Continue',false));
    return;
  }
  // Ensure D.statuses has an entry for each stage
  stages.forEach(function(s) {
    if (!D.statuses[s.id]) D.statuses[s.id] = { label: s.label, selected: [], custom: [], open: false };
  });

  function buildStageCards(stages) { return stages.map(function(s) {
    var st = D.statuses[s.id];
    var suggestions = getStatusSuggestions(s.label);
    var count = st.selected.length + st.custom.length;
    var isOpen = st.open || false;

    var suggestionPills = suggestions.map(function(sug) {
      var isSel = st.selected.includes(sug);
      return '<span class="status-pill' + (isSel ? ' sel' : '') + '" '
        + 'data-stage="' + s.id + '" data-status="' + sug.replace(/"/g,'&quot;') + '" '
        + 'style="display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;margin:3px;'
        + (isSel ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
        + '">' + sug + '</span>';
    }).join('');

    var customTags = st.custom.map(function(tag) {
      return '<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg2);border:.5px solid var(--border);border-radius:20px;font-size:12px;">'
        + tag + '<span style="cursor:pointer;color:var(--text3);" data-remove-status="1" data-stage="' + s.id + '" data-tag="' + tag.replace(/"/g,'&quot;') + '">×</span></span>';
    }).join('');

    return '<div style="border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;">'
      + '<div style="padding:12px 16px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" '
      + 'data-stage="' + s.id + '" data-stage-click="1">'
      + '<div style="display:flex;align-items:center;gap:10px;">'
      + '<span style="width:7px;height:7px;border-radius:50%;background:' + (count > 0 ? '#3B6D11' : 'var(--border2)') + ';flex-shrink:0;"></span>'
      + '<span style="font-size:14px;font-weight:500;">' + s.label + '</span>'
      + (count > 0 ? '<span style="padding:2px 8px;border-radius:20px;font-size:11px;background:' + AC + '12;border:.5px solid ' + AC + '40;color:' + AC + '">' + count + ' status' + (count !== 1 ? 'es' : '') + '</span>' : '<span style="font-size:12px;color:var(--text3);">click to define statuses</span>')
      + '</div>'
      + '<span style="font-size:11px;color:var(--text3);">' + (isOpen ? '▲' : '▼') + '</span>'
      + '</div>'
      + (isOpen ? '<div style="padding:16px;border-top:.5px solid var(--border);">'
        + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Common statuses for ' + s.label + ' — select all that apply</div>'
        + '<div style="margin-bottom:14px;">' + suggestionPills + '</div>'
        + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Add custom status</div>'
        + '<div style="display:flex;gap:8px;margin-bottom:8px;">'
        + '<input type="text" class="mini" id="custom-status-' + s.id + '" placeholder="e.g. TA Manager Review, Compliance Hold..." style="flex:1;">'
        + '<button class="add-status-btn" data-stage="' + s.id + '" style="padding:9px 16px;background:' + AC + ';color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;white-space:nowrap;">Add</button>'
        + '</div>'
        + (st.custom.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + customTags + '</div>' : '')
        + '</div>' : '')
      + '</div>';
  }).join(''); }

  var cards = buildStageCards(stages);
  var allCount = stages.reduce(function(sum, s) {
    return sum + (D.statuses[s.id] ? D.statuses[s.id].selected.length + D.statuses[s.id].custom.length : 0);
  }, 0);

  // Auto-open first stage if none are open yet
  var anyOpen = stages.some(function(s){ return D.statuses[s.id] && D.statuses[s.id].open; });
  if (!anyOpen && stages.length > 0) { D.statuses[stages[0].id].open = true; cards = buildStageCards(stages); }
  qc(qstep('Stages & statuses')
    + qheading('What happens inside each stage?')
    + qsubhead('Select the statuses candidates move through within each stage. Expand a stage to choose.')
    + cards
    + fnav('ns', 'Continue', allCount === 0));
}

function rSubprocess(){
  // Step 8: Assign owners + define rounds per STATUS (not per stage)
  var stages = getStageList();
  var roles = getAllRoles();

  // Build flat list of all statuses across all stages
  var allStatuses = [];
  stages.forEach(function(s) {
    var st = D.statuses[s.id];
    if (!st) return;
    var statusList = [...(st.selected || []), ...(st.custom || [])];
    statusList.forEach(function(statusName) {
      var statusId = s.id + '__' + statusName.replace(/[^a-zA-Z0-9]/g,'_');
      if (!D.subprocess[statusId]) {
        D.subprocess[statusId] = {
          label: statusName,
          stageLabel: s.label,
          stageId: s.id,
          owner: [],
          outcomes: [],
          hasRounds: false,
          rounds: [],
          open: false
        };
      }
      allStatuses.push({ id: statusId, label: statusName, stageLabel: s.label, stageId: s.id });
    });
  });

  if (!allStatuses.length) {
    qc(sl('Sub-processes & owners') + qt('No statuses defined yet')
      + qh('Go back to step 7 and define statuses within each stage first.')
      + fnav('ns','Continue',false));
    return;
  }

  // Group statuses by stage for display
  var stageGroups = {};
  allStatuses.forEach(function(st) {
    if (!stageGroups[st.stageId]) stageGroups[st.stageId] = { label: st.stageLabel, statuses: [] };
    stageGroups[st.stageId].statuses.push(st);
  });

  var cards = Object.keys(stageGroups).map(function(stageId) {
    var group = stageGroups[stageId];
    var statusCards = group.statuses.map(function(st) {
      var sp = D.subprocess[st.id];
      var ownerCount = sp.owner ? sp.owner.length : 0;
      var isOpen = sp.open || false;
      var isConfigured = ownerCount > 0 || sp.outcomes.length > 0;

      var ownerPills = roles.map(function(r) {
        var isSel = sp.owner && sp.owner.includes(r);
        return '<span style="padding:4px 10px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;'
          + (isSel ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
          + '" data-action="toggleStatusOwner" data-sid="' + st.id + '" data-role="' + r.replace(/"/g,'&quot;') + '">' + r + '</span>';
      }).join('');

      var outcomePills = [{k:'advance',l:'Advance'},{k:'approve',l:'Approve'},{k:'reject',l:'Reject / Decline'},{k:'hold',l:'Hold'}].map(function(o) {
        var isSel = sp.outcomes && sp.outcomes.includes(o.k);
        return '<span style="padding:4px 10px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;'
          + (isSel ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
          + '" data-action="toggleStatusOutcome" data-sid="' + st.id + '" data-outcome="' + o.k + '">' + o.l + '</span>';
      }).join('');

      return '<div style="border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;">'
        + '<div style="padding:10px 14px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" '
        + 'data-sid="' + st.id + '" onclick="toggleSpCard(this)">'
        + '<div style="display:flex;align-items:center;gap:8px;">'
        + '<span style="width:6px;height:6px;border-radius:50%;background:' + (isConfigured ? '#3B6D11' : 'var(--border2)') + ';flex-shrink:0;"></span>'
        + '<span style="font-size:13px;font-weight:500;">' + st.label + '</span>'
        + (isConfigured ? '<span style="padding:1px 7px;border-radius:20px;font-size:11px;background:' + AC + '12;border:.5px solid ' + AC + '40;color:' + AC + '">configured</span>' : '')
        + '</div>'
        + '<span style="font-size:11px;color:var(--text3);">' + (isOpen ? '▲' : '▼') + '</span>'
        + '</div>'
        + (isOpen ? '<div style="padding:14px;border-top:.5px solid var(--border);display:flex;flex-direction:column;gap:12px;">'
          + '<div style="background:var(--bg2);border-radius:var(--radius);padding:12px;">'
          + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Who owns this status / action?</div>'
          + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + ownerPills + '</div>'
          + '</div>'
          + '<div style="background:var(--bg2);border-radius:var(--radius);padding:12px;">'
          + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Outcomes from this status</div>'
          + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + outcomePills + '</div>'
          + '</div>'
          + '<div style="background:var(--bg2);border-radius:var(--radius);padding:12px;">'
          + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Does this status involve multiple rounds or steps?</div>'
          + '<div style="display:flex;gap:8px;">'
          + '<span style="padding:6px 14px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;'
          + (sp.hasRounds ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
          + '" data-action="toggleHasRounds" data-sid="' + st.id + '" data-val="true">Yes — define rounds</span>'
          + '<span style="padding:6px 14px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;'
          + (!sp.hasRounds ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
          + '" data-action="toggleHasRounds" data-sid="' + st.id + '" data-val="false">No — single step</span>'
          + '</div>'
          + (sp.hasRounds ? buildRounds(st.id, roles) : '')
          + '</div>'
          + '</div>' : '')
        + '</div>';
    }).join('');

    return '<div style="margin-bottom:18px;">'
      + '<div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:' + AC + ';margin-bottom:8px;padding:0 2px;">' + group.label + '</div>'
      + statusCards
      + '</div>';
  }).join('');

  qc(qstep('Owners & rounds')
    + qheading('Who owns each step, and what can happen next?')
    + qsubhead('For each status, assign an owner, set outcomes, and define rounds where applicable. Expand any card to configure.')
    + cards
    + fnav('ns','Continue',false));
}

function buildRounds(sid, roles){
  var sp = D.subprocess[sid];
  if (!sp || !sp.rounds) return '';
  var html = '';
  sp.rounds.forEach(function(r, ri) {
    if (ri > 0) {
      html += '<div style="display:flex;align-items:center;gap:8px;margin:6px 0;padding:7px 10px;background:var(--bg2);border-radius:var(--radius);">'
        + '<div style="width:12px;height:12px;background:#E6F1FB;border:.5px solid #185FA5;transform:rotate(45deg);flex-shrink:0;"></div>'
        + '<span style="font-size:12px;color:var(--text2);">Pass gate — decision diamond before this round</span></div>';
    }
    var conductorPills = roles.map(function(role) {
      var isSel = r.conductors && r.conductors.includes(role);
      return '<span style="padding:4px 10px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;margin:2px;'
        + (isSel ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
        + '" data-action="toggleRoundConductor" data-sid="' + sid + '" data-ri="' + ri + '" data-role="' + role.replace(/"/g,'&quot;') + '">' + role + '</span>';
    }).join('');

    html += '<div style="border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;">'
      + '<div style="padding:10px 14px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" '
      + 'data-sid="' + sid + '" data-ri="' + ri + '" onclick="toggleRound2(this)">'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<span style="width:20px;height:20px;border-radius:50%;background:'+AC+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;">'+(ri+1)+'</span>'
      + '<input type="text" value="' + r.name + '" onclick="event.stopPropagation()" '
      + 'data-sid="' + sid + '" data-ri="' + ri + '" oninput="updateRoundName(this)" '
      + 'style="font-size:13px;font-weight:500;border:none;background:transparent;color:var(--text);padding:0;width:160px;font-family:var(--font);">'
      + '</div>'
      + '<div style="display:flex;gap:6px;align-items:center;">'
      + '<button style="padding:3px 8px;background:transparent;border:.5px solid var(--border);border-radius:4px;font-size:11px;cursor:pointer;" '
      + 'data-sid="' + sid + '" data-ri="' + ri + '" onclick="event.stopPropagation();delRound2(this)">Remove</button>'
      + '<span style="font-size:11px;color:var(--text3);">' + (r.open ? '▲' : '▼') + '</span>'
      + '</div></div>'
      + (r.open ? '<div style="padding:14px;border-top:.5px solid var(--border);">'
        + '<div style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;">Who conducts this round?</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;">' + conductorPills + '</div>'
        + '<div style="padding:8px 10px;background:#FAEEDA;border:.5px solid #BA7517;border-radius:var(--radius);display:flex;align-items:center;gap:8px;">'
        + '<span style="font-size:11px;color:#854F0B;font-weight:500;white-space:nowrap;">Only if:</span>'
        + '<input type="text" class="mini" placeholder="e.g. director-level only, technical roles..." value="' + (r.condition||'') + '" '
        + 'data-sid="' + sid + '" data-ri="' + ri + '" oninput="updateRoundCondition(this)" '
        + 'style="border:none;background:transparent;color:#412402;">'
        + '</div></div>' : '')
      + '</div>';
  });
  html += '<button data-sid="' + sid + '" onclick="addRound2(this)" style="width:100%;padding:9px;background:transparent;border:.5px dashed var(--border);border-radius:var(--radius);font-size:13px;cursor:pointer;color:var(--text2);font-family:var(--font);margin-top:6px;">+ Add another round</button>';
  return html;
}

function rActions(){
  var stages = getStageList();
  var roles = getAllRoles();
  var allStatuses = [];
  stages.forEach(function(s) {
    var st = D.statuses[s.id];
    if (!st) return;
    var statusList = [].concat(st.selected || [], st.custom || []);
    statusList.forEach(function(statusName) {
      var statusId = s.id + '__' + statusName.replace(/[^a-zA-Z0-9]/g,'_');
      if (!D.subprocess[statusId]) {
        D.subprocess[statusId] = { label:statusName, stageLabel:s.label, stageId:s.id, owner:[], outcomes:[], hasRounds:false, rounds:[], open:false };
      }
      allStatuses.push({ id:statusId, label:statusName, stageLabel:s.label, stageId:s.id });
    });
  });
  if (!allStatuses.length) {
    qc(qstep('Actions')
      + qheading('No statuses defined yet')
      + qsubhead('Go back to Step 7 and define statuses within your stages first — then return here to assign owners and outcomes.')
      + fnav('ns','Continue',false));
    return;
  }
  var stageGroups = {};
  allStatuses.forEach(function(st) {
    if (!stageGroups[st.stageId]) stageGroups[st.stageId] = { label:st.stageLabel, statuses:[] };
    stageGroups[st.stageId].statuses.push(st);
  });
  var cards = Object.keys(stageGroups).map(function(stageId) {
    var group = stageGroups[stageId];
    var rows = group.statuses.map(function(st) {
      var sp = D.subprocess[st.id];
      var configured = (sp.owner && sp.owner.length > 0) || (sp.outcomes && sp.outcomes.length > 0);
      var ownerPills = roles.map(function(r) {
        var isSel = sp.owner && sp.owner.includes(r);
        return '<span style="display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;margin:2px;'
          + (isSel ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
          + '" data-action="toggleStatusOwner" data-sid="'+st.id+'" data-role="'+r.replace(/"/g,'&quot;')+'">'+r+'</span>';
      }).join('');
      var outcomePills = [{k:'advance',l:'Advance'},{k:'approve',l:'Approve'},{k:'reject',l:'Reject'},{k:'hold',l:'Hold'}].map(function(o) {
        var isSel = sp.outcomes && sp.outcomes.includes(o.k);
        return '<span style="display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;border:.5px solid;cursor:pointer;margin:2px;'
          + (isSel ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
          + '" data-action="toggleStatusOutcome" data-sid="'+st.id+'" data-outcome="'+o.k+'">'+o.l+'</span>';
      }).join('');
      return '<div style="border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;">'
        + '<div style="padding:10px 16px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" data-sid="'+st.id+'" onclick="toggleActCard(this)">'
        + '<div style="display:flex;align-items:center;gap:8px;">'
        + '<span style="width:6px;height:6px;border-radius:50%;flex-shrink:0;background:'+(configured?'#3B6D11':'var(--border2)')+'"></span>'
        + '<span style="font-size:13px;font-weight:500;">'+st.label+'</span>'
        + (configured ? '<span style="padding:1px 7px;border-radius:20px;font-size:11px;background:'+AC+'12;border:.5px solid '+AC+'40;color:'+AC+'">configured</span>' : '<span style="font-size:11px;color:var(--text3);">click to configure</span>')
        + '</div>'
        + '<span style="font-size:11px;color:var(--text3);">'+(sp.open?'▲':'▼')+'</span>'
        + '</div>'
        + (sp.open
          ? '<div style="padding:14px;border-top:.5px solid var(--border);display:flex;flex-direction:column;gap:12px;">'
            + '<div style="background:var(--bg2);border-radius:var(--radius);padding:12px;">'
            + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Who owns this action?</div>'
            + '<div style="display:flex;flex-wrap:wrap;">'+ownerPills+'</div>'
            + '</div>'
            + '<div style="background:var(--bg2);border-radius:var(--radius);padding:12px;">'
            + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Possible outcomes</div>'
            + '<div style="display:flex;flex-wrap:wrap;">'+outcomePills+'</div>'
            + '</div>'
            + '</div>'
          : '')
        + '</div>';
    }).join('');
    return '<div style="margin-bottom:18px;">'
      + '<div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:'+AC+';margin-bottom:8px;padding:0 2px;">'+group.label+'</div>'
      + rows + '</div>';
  }).join('');
  qc(qstep('Actions')
    + qheading('Confirm owners and outcomes per status')
    + qsubhead('Review who owns each action and what outcomes are possible. These drive the decision nodes on your map.')
    + cards
    + fnav('ns','Continue',false));
}

function rBranching(){
  // Step 11 (Full mode): Entrance Criteria
  // Define prerequisite conditions that must be met before a status/stage can be entered
  var stages = getStageList();
  var allStatuses = [];
  stages.forEach(function(s) {
    var st = D.statuses[s.id];
    if (st) {
      [].concat(st.selected||[], st.custom||[]).forEach(function(name) {
        allStatuses.push({ stageLabel:s.label, name:name, key:s.id+'__'+name.replace(/[^a-zA-Z0-9]/g,'_') });
      });
    }
  });
  // Also offer stage-level criteria if no statuses defined
  var targets = allStatuses.length ? allStatuses : stages.map(function(s){ return { stageLabel:s.label, name:s.label, key:s.id }; });
  if (!D.branching.criteria) D.branching.criteria = {};

  // Common entrance criteria suggestions
  var SUGGESTIONS = [
    'Application must be complete and reviewed',
    'Assessment must be submitted and scored',
    'Phone screen must be completed',
    'Background check must be initiated',
    'Offer letter must be signed',
    'Reference check must be complete',
    'Hiring manager approval required',
    'Compensation approval required',
    'I-9 documentation must be on file',
  ];

  var cards = targets.map(function(t) {
    var crit = D.branching.criteria[t.key] || { rules:[], open:false };
    if (!D.branching.criteria[t.key]) D.branching.criteria[t.key] = crit;
    var hasCrit = crit.rules && crit.rules.length > 0;
    var sugg = SUGGESTIONS.map(function(s) {
      var isAdded = crit.rules && crit.rules.indexOf(s) > -1;
      return '<span style="display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;border:.5px solid;cursor:pointer;margin:2px;'
        + (isAdded ? 'background:'+AC+';color:#fff;border-color:'+AC : 'background:var(--bg);border-color:var(--border);color:var(--text)')
        + '" data-key="'+t.key+'" data-sugg="'+s.replace(/"/g,'&quot;')+'" onclick="toggleCritSugg(this)">'+s+'</span>';
    }).join('');
    var customRows = (crit.rules||[]).filter(function(r){ return SUGGESTIONS.indexOf(r)<0; }).map(function(r,ri) {
      return '<div style="display:flex;gap:8px;margin-bottom:6px;">'
        + '<input class="mini" type="text" value="'+r.replace(/"/g,'&quot;')+'" style="flex:1;" data-key="'+t.key+'" data-ri="'+ri+'" oninput="updateCritRule(this)">'
        + '<button style="padding:7px 10px;background:transparent;border:.5px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--text2);" data-key="'+t.key+'" data-rule="'+r.replace(/"/g,'&quot;')+'" onclick="delCritRule(this)">×</button>'
        + '</div>';
    }).join('');
    return '<div style="border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;">'
      + '<div style="padding:10px 16px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" data-key="'+t.key+'" onclick="toggleCritCard(this)">'
      + '<div style="display:flex;align-items:center;gap:8px;min-width:0;">'
      + '<span style="width:6px;height:6px;border-radius:50%;flex-shrink:0;background:'+(hasCrit?'#3B6D11':'var(--border2)')+'"></span>'
      + '<span style="font-size:11px;color:var(--text3);margin-right:4px;">'+t.stageLabel+' ›</span>'
      + '<span style="font-size:13px;font-weight:500;">'+t.name+'</span>'
      + (hasCrit ? '<span style="padding:1px 7px;border-radius:20px;font-size:11px;background:'+AC+'12;border:.5px solid '+AC+'40;color:'+AC+'">'+crit.rules.length+' rule'+(crit.rules.length!==1?'s':'')+'</span>' : '')
      + '</div>'
      + '<span style="font-size:11px;color:var(--text3);">'+(crit.open?'▲':'▼')+'</span>'
      + '</div>'
      + (crit.open
        ? '<div style="padding:14px;border-top:.5px solid var(--border);">'
          + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Common prerequisites — select all that apply</div>'
          + '<div style="margin-bottom:14px;">'+sugg+'</div>'
          + '<div style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Custom requirement</div>'
          + customRows

  var cl = D[section] && D[section].customLabels && D[section].customLabels[id];
  var currentVal = cl || defaultLabel;

  input.style.width = Math.max(currentVal.length * 9, 120) + 'px';

function hexToRgbArr(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}

async function generatePDF() {

  const doc = new jsPDF({orientation:'landscape',unit:'pt',format:[2592,1728]});
  const W=2592,H=1728,MARGIN=32,LABEL_W=116,TITLE_H=78,LEGEND_H=36,FOOTER_H=22,PHASE_H=26;
  const MAP_X=MARGIN+LABEL_W, MAP_Y=MARGIN+TITLE_H+8;
  const MAP_TOP=H-MARGIN-LEGEND_H-FOOTER_H-PHASE_H-10;
  const MAP_H=MAP_TOP-PHASE_H-MAP_Y, MAP_W=W-MARGIN-MAP_X;

  const LANE_COUNT=Math.max(userLabels.length,1),LANE_H=MAP_H/LANE_COUNT;
  const [AR,AG,AB]=hexToRgbArr(AC);
  const DR=Math.round(AR*.52),DG=Math.round(AG*.52),DB=Math.round(AB*.52);
  const LR=Math.min(255,232+Math.round((255-AR)*.28)),LG=Math.min(255,232+Math.round((255-AG)*.28)),LB=Math.min(255,232+Math.round((255-AB)*.28));
  const PHASES=[{l:'Req opening',f0:0,f1:.135},{l:'Req approval',f0:.135,f1:.265},{l:'Sourcing',f0:.265,f1:.375},{l:'Screening',f0:.375,f1:.495},{l:'Interview',f0:.495,f1:.735},{l:'Offer',f0:.735,f1:.865},{l:'Pre-hire',f0:.865,f1:1}];
  const px=f=>MAP_X+f*MAP_W, laneCY=i=>MAP_Y+MAP_H-(i+.5)*LANE_H, laneBot=i=>MAP_Y+MAP_H-(i+1)*LANE_H;
  doc.setFillColor(255,255,255);doc.rect(0,0,W,H,'F');

  doc.setFontSize(10);doc.text('36" × 24" · 300 DPI · '+new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'}),W-MARGIN-14,MARGIN+44,{align:'right'});
  PHASES.forEach((ph,idx)=>{

    doc.setFillColor(Math.min(255,AR+(lt?22:0)),Math.min(255,AG+(lt?14:0)),Math.min(255,AB+(lt?22:0)));
    doc.rect(x0,MAP_TOP,x1-x0,PHASE_H,'F');
    doc.setDrawColor(255,255,255);doc.setLineWidth(.7);doc.line(x0,MAP_TOP,x0,MAP_TOP+PHASE_H);
    doc.setTextColor(255,255,255);doc.setFontSize(8.5);doc.setFont('helvetica','bold');
    doc.text(ph.l,(x0+x1)/2,MAP_TOP+17,{align:'center'});
  });
  doc.setFillColor(AR,AG,AB);doc.rect(MARGIN,MAP_TOP,LABEL_W,PHASE_H,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');

  userLabels.forEach((name,i)=>{

    doc.setFillColor(i%2===0?255:250,i%2===0?255:249,i%2===0?255:252);doc.rect(MAP_X,yb,MAP_W,LANE_H,'F');
    doc.setFillColor(i%2===0?LR:Math.max(LR-8,220),i%2===0?LG:Math.max(LG-8,218),i%2===0?LB:Math.max(LB-6,225));doc.rect(MARGIN,yb,LABEL_W,LANE_H,'F');
    doc.setTextColor(DR,DG,DB);doc.setFontSize(9);doc.setFont('helvetica','bold');

  doc.setLineDash([4,4]);PHASES.forEach(ph=>{doc.setDrawColor(210,205,218);doc.setLineWidth(.4);doc.line(px(ph.f0),MAP_Y,px(ph.f0),MAP_TOP);});doc.setLineDash([]);
  doc.setDrawColor(AR,AG,AB);doc.setLineWidth(1.2);doc.line(MAP_X,MAP_Y,MAP_X,MAP_TOP+PHASE_H);
  doc.setLineWidth(2);doc.rect(MARGIN,MAP_Y,W-2*MARGIN,MAP_H+PHASE_H,'S');
  const colW=MAP_W/Math.max(stageList.length+1,9),TW=Math.min(colW*.82,120),TH=30;

    const a=D.actions[stage.id],sp=D.subprocess[stage.id],hasSP=sp&&sp.hasSubprocess===true;
    doc.setFillColor(255,255,255);doc.setDrawColor(AR,AG,AB);doc.setLineWidth(hasSP?1.8:1);

    if(hasSP){doc.setFillColor(AR,AG,AB);doc.rect(cx-TW/2+3,cy-TH/2+3,18,11,'F');doc.setTextColor(255,255,255);doc.setFontSize(6.5);doc.setFont('helvetica','bold');doc.text('[+]',cx-TW/2+12,cy-TH/2+11,{align:'center'});}
    doc.setTextColor(DR,DG,DB);doc.setFontSize(8);doc.setFont('helvetica',hasSP?'bold':'normal');
    const ll=doc.splitTextToSize(stage.label,TW-12),lh2=10,ly=cy-(ll.length-1)*lh2/2+2;
    ll.forEach((ln,li2)=>doc.text(ln,cx,ly+li2*lh2,{align:'center'}));

    if(nsi>-1){const nCX=MAP_X+(nsi+.9)*colW+colW*.35;doc.setDrawColor(160,148,172);doc.setLineWidth(.8);doc.line(cx+TW/2+1,cy,nCX-TW/2-8,cy);doc.setFillColor(160,148,172);doc.rect(nCX-TW/2-8,cy-3,6,6,'F');}
    if(a&&a.outcomes&&a.outcomes.length){
      const dx=cx+TW/2+28,dw=18,dh=13;
      doc.setFillColor(225,240,252);doc.setDrawColor(24,95,165);doc.setLineWidth(.9);doc.rect(dx-dw/2,cy-dh/2,dw,dh,'FD');
      doc.setTextColor(4,44,83);doc.setFontSize(7);doc.setFont('helvetica','bold');doc.text('?',dx,cy+2.5,{align:'center'});
      if(a.outcomes.includes('advance')||a.outcomes.includes('approve')){doc.setDrawColor(30,120,70);doc.setLineWidth(1.3);doc.line(dx+dw/2+2,cy,dx+dw/2+22,cy);doc.setTextColor(30,120,70);doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.text('Yes',dx+dw/2+12,cy-5,{align:'center'});}
      if(a.outcomes.includes('reject')){doc.setDrawColor(170,35,25);doc.setLineWidth(1.3);doc.line(dx,cy+dh/2+2,dx,cy+dh/2+20);doc.setTextColor(170,35,25);doc.setFontSize(7.5);doc.text('No',dx+5,cy+dh/2+15);}
    }

  const legY=H-MARGIN-FOOTER_H-LEGEND_H-2;
  doc.setFillColor(248,247,250);doc.setDrawColor(200,195,210);doc.setLineWidth(.5);doc.rect(MARGIN,legY,W-2*MARGIN,LEGEND_H,'FD');
  [{lbl:'Task',fr:[255,255,255],sr:[AR,AG,AB]},{lbl:'Decision',fr:[225,240,252],sr:[24,95,165]},{lbl:'Approved →',fr:[30,120,70],sr:[30,120,70],arr:true},{lbl:'Rejected →',fr:[170,35,25],sr:[170,35,25],arr:true},{lbl:'[+] Sub-process',fr:[255,255,255],sr:[AR,AG,AB],dash:true}].forEach((item,i)=>{
    const lx=MARGIN+i*(W-2*MARGIN)/5+(W-2*MARGIN)/10,ly=legY+LEGEND_H/2-2;

    if(item.arr){doc.setDrawColor(...item.sr);doc.setLineWidth(1.5);doc.line(lx-14,ly,lx+6,ly);doc.setFillColor(...item.fr);doc.rect(lx+6,ly-3,8,6,'F');}
    else doc.rect(lx-14,ly-7,28,14,'FD');
    doc.setLineDash([]);doc.setTextColor(80,72,92);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(item.lbl,lx,legY+LEGEND_H-3,{align:'center'});
  });
  doc.setTextColor(130,120,145);doc.setFontSize(8);doc.setFont('helvetica','normal');
  doc.text((D.setup.orgName||'Org')+' · '+(D.setup.trackName||'Process')+' · CONFIDENTIAL',MARGIN+12,H-MARGIN-5);
  doc.text('Generated '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+' · TA Process Mapping Tool',W-MARGIN-12,H-MARGIN-5,{align:'right'});
  doc.save(((D.setup.orgName||'TA')+'_'+(D.setup.trackName||'Process')+'_Map.pdf').replace(/\s+/g,'_'));
}

async function generateDOCX() {
  if(typeof docx === 'undefined') {
    throw new Error('docx library not loaded. If testing locally, open via GitHub Pages instead of file://');
  }
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,HeadingLevel,AlignmentType,BorderStyle,WidthType,ShadingType,LevelFormat}=docx;
  const userLabels=[...D.users.selected.map(u=>(D.users.customLabels&&D.users.customLabels[u])||(USERS.find(o=>o.id===u)||{label:u}).label),...D.users.custom];
  const stageList=getStageList();
  const integLabels=[...D.integrations.selected.map(i=>(D.integrations.customLabels&&D.integrations.customLabels[i])||(INTEGS.find(o=>o.id===i)||{label:i}).label),...D.integrations.custom];
  const BH=AC.replace('#','');
  // Resolve ATS platform label — handles 'other' + custom entry
  var atsLabel = D.ats.platform==='other'
    ? (D.ats.customPlatform||'Other ATS')
    : ((ATS_P.find(function(p){return p.id===D.ats.platform;})||{label:'ATS'}).label);
  const bd={style:BorderStyle.SINGLE,size:1,color:'CCCCCC'};
  const borders={top:bd,bottom:bd,left:bd,right:bd};
  const h1=t=>new Paragraph({heading:HeadingLevel.HEADING_1,spacing:{before:320,after:100},children:[new TextRun({text:t,bold:true,size:32,color:BH,font:'Arial'})]});
  const body=(t,o)=>new Paragraph({spacing:{before:60,after:60},children:[new TextRun(Object.assign({text:t,size:20,font:'Arial'},o||{}))]});
  const bul=t=>new Paragraph({numbering:{reference:'bullets',level:0},spacing:{before:40,after:40},children:[new TextRun({text:t,size:20,font:'Arial'})]});
  const sp=()=>new Paragraph({children:[new TextRun('')]});
  const hRow=(cs,ws)=>new TableRow({tableHeader:true,children:cs.map((t,i)=>new TableCell({borders,width:{size:ws[i],type:WidthType.DXA},shading:{fill:BH,type:ShadingType.CLEAR},margins:{top:80,bottom:80,left:120,right:120},children:[new Paragraph({children:[new TextRun({text:t,bold:true,size:18,color:'FFFFFF',font:'Arial'})]})]}))} );
  const dRow=(cs,ws,sh)=>new TableRow({children:cs.map((t,i)=>new TableCell({borders,width:{size:ws[i],type:WidthType.DXA},shading:{fill:sh?'F5F5F5':'FFFFFF',type:ShadingType.CLEAR},margins:{top:80,bottom:80,left:120,right:120},children:[new Paragraph({children:[new TextRun({text:String(t),size:18,font:'Arial'})]})]}))} );
  const doc2=new Document({
    styles:{default:{document:{run:{font:'Arial',size:20}}}},
    numbering:{config:[{reference:'bullets',levels:[{level:0,format:LevelFormat.BULLET,text:'•',alignment:AlignmentType.LEFT,style:{paragraph:{indent:{left:720,hanging:360}}}}]}]},
    sections:[{properties:{page:{size:{width:12240,height:15840},margin:{top:1440,right:1440,bottom:1440,left:1440}}},children:[
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:720,after:120},children:[new TextRun({text:'TALENT ACQUISITION SOP',font:'Arial',size:36,bold:true,color:BH})]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:0,after:160},children:[new TextRun({text:D.setup.orgName||'Organization',font:'Arial',size:48,bold:true})]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:0,after:480},children:[new TextRun({text:(D.setup.trackName||'Process')+' · '+atsLabel,font:'Arial',size:22,color:'777777'})]}),
      sp(),sp(),
      h1('1. System Users'),
      ...(userLabels.length?[new Table({width:{size:9360,type:WidthType.DXA},columnWidths:[2800,6560],rows:[
        hRow(['Role','Responsibility'],[2800,6560]),
        ...userLabels.map((u,i)=>dRow([u,'Participant in hiring process'],[2800,6560],i%2===1))
      ]})]:[body('No users defined.')]),sp(),
      h1('2. Requisition Opening'),
      body('Method: '+(D.reqflow.reqOpenMethod.map(m=>(REQ_OPEN.find(o=>o.id===m)||{label:m}).label).join(', ')||'Not specified')),sp(),
      h1('3. Candidate Pipeline Stages & Statuses'),
      ...stageList.map(function(s){
        var stageRows=[new Paragraph({spacing:{before:120,after:60},children:[new TextRun({text:s.label,bold:true,size:22,font:'Arial',color:BH})]})];
        var st=D.statuses&&D.statuses[s.id];
        var statusList=st?[].concat(st.selected||[],st.custom||[]):[];
        statusList.forEach(function(statusName){
          var sid=s.id+'__'+statusName.replace(/[^a-zA-Z0-9]/g,'_');
          var sp2=D.subprocess&&D.subprocess[sid];
          var ownerTxt=sp2&&sp2.owner&&sp2.owner.length?' — Owner: '+sp2.owner.join(', '):'';
          var outTxt=sp2&&sp2.outcomes&&sp2.outcomes.length?' — Outcomes: '+sp2.outcomes.join(', '):'';
          stageRows.push(bul(statusName+ownerTxt+outTxt));
          if(sp2&&sp2.hasRounds&&sp2.rounds&&sp2.rounds.length){
            sp2.rounds.forEach(function(r,ri){
              stageRows.push(new Paragraph({numbering:{reference:'bullets',level:0},spacing:{before:30,after:30},indent:{left:1080},children:[new TextRun({text:'Round '+(ri+1)+': '+r.name+(r.condition?' ('+r.condition+')':''),size:18,color:'555555',font:'Arial'})]}));
            });
          }
          var crit=D.branching&&D.branching.criteria&&D.branching.criteria[sid];
          if(crit&&crit.rules&&crit.rules.length){
            stageRows.push(new Paragraph({spacing:{before:20,after:20},indent:{left:720},children:[new TextRun({text:'Entrance requirements: '+crit.rules.length+' defined — see Section 5',size:17,color:'854F0B',font:'Arial',italics:true})]}));
          }

        if(!statusList.length) stageRows.push(bul(s.label+' (no statuses defined)'));

      }).flat(),sp(),
      h1('4. Integrations'),
      integLabels.length?new Table({width:{size:9360,type:WidthType.DXA},columnWidths:[3000,6360],rows:[hRow(['Integration','Function'],[3000,6360]),...integLabels.map((ig,i)=>dRow([ig,'Connected to '+atsLabel],[3000,6360],i%2===1))]}):body('No integrations defined.'),sp(),
      h1('5. Entrance Criteria by Status'),
      body('The following statuses have prerequisite conditions that must be met before a candidate can be moved into that status.'),sp(),
      ...(function(){
        var criteriaRows=[];
        var hasCriteria=false;
        stageList.forEach(function(s){
          var st=D.statuses&&D.statuses[s.id];
          var statusList=st?[].concat(st.selected||[],st.custom||[]):[];
          statusList.forEach(function(statusName){
            var sid=s.id+'__'+statusName.replace(/[^a-zA-Z0-9]/g,'_');
            var crit=D.branching&&D.branching.criteria&&D.branching.criteria[sid];
            if(crit&&crit.rules&&crit.rules.length){
              hasCriteria=true;
              criteriaRows.push(new Paragraph({spacing:{before:160,after:40},children:[
                new TextRun({text:s.label+' › ',size:19,font:'Arial',color:'888888'}),
                new TextRun({text:statusName,bold:true,size:20,font:'Arial',color:BH})
              ]}));
              crit.rules.forEach(function(rule){
                criteriaRows.push(new Paragraph({
                  numbering:{reference:'bullets',level:0},
                  spacing:{before:40,after:40},
                  children:[new TextRun({text:rule,size:19,font:'Arial'})]
                }));
              });
            }
          });
        });
        if(!hasCriteria) criteriaRows.push(body('No entrance criteria were defined for this process track.'));
        return criteriaRows;
      })(),sp(),
      h1('6. Document Information'),
      new Table({width:{size:9360,type:WidthType.DXA},columnWidths:[2400,6960],rows:[
        dRow(['Organization',D.setup.orgName||'—'],[2400,6960]),
        dRow(['Track',D.setup.trackName||'—'],[2400,6960],true),
        dRow(['ATS',atsLabel],[2400,6960]),
        dRow(['Generated',new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})],[2400,6960],true),
        dRow(['Tool','TA Process Mapping Tool — TASSP Playbook'],[2400,6960]),
      ]}),
    ]}]
  });
  const blob=await Packer.toBlob(doc2);
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=((D.setup.orgName||'TA')+'_'+(D.setup.trackName||'Process')+'_SOP.docx').replace(/\s+/g,'_');
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
